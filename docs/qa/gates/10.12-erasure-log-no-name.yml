top_issues:
  - id: 'DOC-001'
    severity: low
    finding: 'Q-C2 and Q-C3 are in both CLI references with one empty line added before the closing sentence ("Delete those exports ...", « Supprimez vous-même ... »), so that Markdown renders it outside the last bullet. That is the only difference from the asked text (probes/texts_1012.py). The orchestrator''s formatting ruling is recorded in the Dev Agent Record and the PR body. Notes for the PO and PM says the SM records such a change, and AC13 says byte for byte; Decisions Recorded and Approved Texts do not mention it.'
    suggested_action: 'SM: record the ruling (no word changed) in Decisions Recorded / Approved Texts at the next story edit. Docs only; no code or doc text change.'
    refs: ['docs/CLI-REFERENCE.md', 'docs/CLI-REFERENCE.fr.md', 'docs/stories/10.12.erasure-log-no-name.story.md']
    suggested_owner: sm
  - id: 'TEST-001'
    severity: low
    finding: 'No test pins PRAGMA secure_delete on the module''s own sqlite3 connections (_connect: the 10.7 conversion, the removal, the compaction). Mutant M2 (that pragma removed) passes the 17 new tests and the four data-layer suites. QA found no scenario where it shows on disk: the compaction rewrites the file, and the removal alone left no copy either. QA''s connection probe pins the property instead (33 _connect connections at 1 on the head, 0 on M2). On the Ubuntu legs T3 and T4 cannot catch M1 either, because the platform default already overwrites; only the Windows and macOS legs pin AC2.'
    suggested_action: 'Backlog: one unit test reading PRAGMA secure_delete on a _connect connection and on an engine connection.'
    refs: ['gdpr_pseudonymizer/data/database.py:179-207', 'tests/unit/test_erasure_log_no_name.py']
    suggested_owner: dev
  - id: 'RISK-001'
    severity: low
    finding: 'On an SQLite without the JSON functions, the first count in _clean_erasure_log raises while named is still -1. Every uncleaned file then stops with the Q-D text, even one whose log holds no name, and the likely cause given is the generic one. QA found no supported platform without them: SQLite builds them in by default since 3.38.0, the Windows and macOS Pythons bundle 3.45.1 and 3.49.1, and Ubuntu 22.04''s 3.37.2 is built with JSON1 (CI Facts). Code reading, not measured on such a platform.'
    suggested_action: 'Backlog: name the cause (no JSON support) in the message, or treat a missing function like PO F1.'
    refs: ['gdpr_pseudonymizer/data/database.py:688-779']
    suggested_owner: dev

