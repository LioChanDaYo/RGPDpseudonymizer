schema: 1
story: '10.12'
story_title: 'Erasure Log Without the Erased Name'
scope: 'PR #104, pre-merge review (Task 7, G2) at head c7749b2 on main 1f35dae. Commits reviewed: e54dd2e and 5878904 (story), tests first e32e0b3, T4''s conditional marker a7694e2, fix ee75ea9, CHANGELOG f96f08f, story cdbb444 and c7749b2 (docs only).'
gate: PASS
status_reason: 'Every AC holds on the written output. New CLI erasure entries hold id, type and reason only. After a CLI or desktop deletion, and after the first 2.3.0 open of QA''s own v2.2.0 file and of a main-written file (CLI and desktop, with a held reader and the retry), no plain, escaped or encrypted copy of an erased name is in the file, its -wal, its -shm or the exports. All 45 connections the package opened report secure_delete=1 on a platform whose default is 0. A read-only file stops with the approved Q-D text only when its log holds names. The 10.7 message and the screen output are unchanged, and the texts are byte-identical (DOC-001''s empty line aside). G2 holds: 14 AssertionErrors on their lines at a7694e2, T3 at :285 and T4 passing under a simulated Linux SQLite. 9 of QA''s 10 mutants are caught. Codex wrote every product and test line, two read-only gpt-6.1-sol reviews approve, and CI is green on every leg with the story''s per-leg counts. Three low items only.'
reviewer: 'Quinn (Test Architect)'
