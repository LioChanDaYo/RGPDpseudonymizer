  - 'Flaky-test fix (tests/unit/test_final_exam_tooling.py, outside the story scope). Cause proven by QA own probe (qa_flaky.py, the real make_server and _Handler of tree_head with a stand-in app, 200 requests each): the old request (urllib POST, foreign Origin, JSON body) 197 x 403 and 3 x ConnectionAbortedError 10053; a body sent 20 ms after the headers 200 x 10053; headers and body in one send 200 x 403; the new request (empty body) 200 x 403. do_POST calls _allowed() before it reads any body, so the body plays no part in the refusal. Still fails if the server accepts: in-memory mutants on the real test, the server accepting a foreign Origin gives assert 500 == 403 (line 1174), accepting anything gives assert 200 == 403 (line 1167); the probe gives 200 x 500 for the new request against the Origin mutant. Server unchanged: git diff 4c40dc2 a531f85 -- scripts/ is empty. Nothing weakened: the Host check, the 403 assert and the accepted POST with its body (200) are as before. The fixed test passed 30 of 30 runs on the checkout. A server-side change (read the body before refusing) would also remove the reset; nobody sees the difference, so it is not needed.'

