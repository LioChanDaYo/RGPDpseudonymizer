schema: 1
story: '13.1'
story_title: 'A Place Pseudonym Fits the Word Before the Place'
scope: 'QA round on head 24b9c86 (branch story/13.1-place-same-kind, pushed, draft PR #133; base origin/main 851b37d), after Lionel''s "yes, fix both" for PERF-131-01 and TEST-131-01. The round''s tests-first commit is 87b3a42 and its fix is 24b9c86; round 1 was on cfa2477 (tests-first f459965). QA folder: rgpd-analysis/r131/qa (scripts and logs, never committed; this round''s logs in logs/qr and logs/qr2).'
gate: PASS
status_reason: 'Both findings Lionel asked to fix are fixed, and the fix changes no behaviour. PERF-131-01: a used-up place draw builds its tiers once (401 and 201 builds before, 1 and 1 now; « la » 501 before, 1 now), costs 0.17 to 0.25 ms against 20 to 35 ms on cfa2477, and an end of 100 new places takes 155 to 163 ms, below the base in the same session (277 to 814 ms). Behaviour: every tier name fits its word and is accepted by accepts_value (12,270 checked); accepts_value''s answers and 18,000 seeded draws are identical on cfa2477''s code and on the head (same SHA-256); no drawn name is refused by the review''s check right after the draw (4,854). TEST-131-01: every P11 and P12 case installs _Dialogs, and M24''s batch case fails at its assert in 1.3 s. CI of 24b9c86 is green with the expected totals. 49 of the 50 mutant entries of the story''s table are killed; M45a survives, adds one tier build per successful draw only, and brings back no per-attempt work (TEST-131-03, low). Left open: the read-only Codex review (AC9) and Lionel''s hand check (AC11).'
reviewer: 'Quinn (Test Architect)'
updated: '2026-11-20T23:35:39Z'

top_issues:
  - id: 'TEST-131-03'
    severity: low
    finding: 'Three shapes of the PERF-131-01 fix are not pinned by any test (QA logs/qr/mutants.tsv, logs/qr2). (1) M45a, the draw calling accepts_value(candidate, "LOCATION", place_word=...) again instead of _place_free: W8 2 passed. Its cost, measured under M45a (qr_count.py): 1 tier build for a used-up draw (as the fix), 2 for every successful draw at 0, 50 and 90 % used (the fix: 1); a fresh draw 0.13 to 0.15 ms against 0.07 to 0.08 ms; 400 places one after the other 99 ms against 88 ms; the end of 100 places 153 and 168 ms, as the head; qr_equiv.py digests identical, so no behaviour change. A used or refused name returns before fits, and a free name fits by construction and ends the draw, so the extra build is at most one per draw: it does not bring back per-attempt work. (2) M45e, accepts_value checking the fit before _place_free while the draw is unchanged: W8 2 passed. It costs one tier build per review proposal checked (_proposal_row), never per draw attempt. (3) Q8, accepts_value''s place branch without its _place_free call: 152 passed on the story''s files with Story 11.5''s and 11.6''s, and 3666 passed, 10 skipped on tests/unit and tests/integration (-n 4). Its used half is masked by _proposal_row''s own is_used check (document_processor.py:1149); its real-name half is reached only when the end''s names refuse a place the review''s names did not, which no test builds. Before the fix the draw went through accepts_value, so the draw tests covered that branch; the shared helper _place_free is pinned (QA Q7, the real-name check removed from it: 8 failed). Wording: Fix design 3 says "W8 pins it (one tier build per draw)"; W8 pins a used-up draw only.'
    suggested_action: 'Not blocking. If the draw or accepts_value is touched again: a W8 case on a fresh library asserting 1 build per draw (kills M45a), and a _proposal_row case where the end''s real-name check refuses a shown place (kills Q8). The orchestrator decides whether to add them now or record them in the backlog.'
    suggested_owner: dev
  - id: 'TEST-131-02'
    severity: low
    finding: 'Five QA mutants beyond the story''s table survive the new tests (QA mutants_qa.tsv): Q1, the in-span « d'' »/« l'' » branch of word_before disabled (82 passed); Q2, the in-span lone « A » disabled (82 passed); Q3, draw_words ignoring the cells'' order (82 passed); Q4, refresh_review_proposals without ctx.place_text = None (113 passed, with Story 11.5''s desktop file); Q5, _place_word_of not recording the word it reads (96 passed). Q1 and Q2 are mostly masked: without them the look-back reads no word, whose first tier is the real place''s letter class, which for « d''Ostrelle » already gives vowel cities. The gold dev corpus has 0 prepositions inside a span; the detector''s spans were not checked.'
    suggested_action: 'No change needed for this story. If one of these paths is touched later, add a W1 case with the preposition inside the span for « d'' » and « A », and a two-cell case for the cells'' order.'
    suggested_owner: dev
  - id: 'DOC-131-01'
    severity: low
    finding: 'Three wording points. (1) AC9''s check, git grep over tests/ as a whole, is a search the Rules forbid; the dev and QA ran it on tests/unit/ and tests/integration/ (nothing, rc 1). (2) Fix design 4''s "under 3 %" for the desktop refresh used a model of draw_words that skips mapping_key: 1.6 ms at 10,000 places, where the shipped draw_words takes about 25 ms (QA qa_check.py part D). Measured through the screen on Story 11.5''s documents, one type-change click is the same on the head and the base (10,000 rows: 608/598/689 ms against 615/665/658 ms; empty database: 41 to 46 ms both), so the claim holds for those documents; at 10,000 places the reading is about 25 ms, roughly 4 % of a 0.6 s refresh. (3) docs/architecture/5-internal-module-interfaces.md#5.3 still shows assign_pseudonym without the new keywords, as the story defers.'
    suggested_action: 'Whoever touches the story next may reword AC9 to tests/unit/ and tests/integration/ and correct the refresh figure; the architecture doc in a later docs pass.'
    suggested_owner: sm

resolved_issues:
  - id: 'PERF-131-01'
    severity: medium
    raised_on: cfa2477
    finding_summary: 'Round 1: once the default theme''s place names were used up, each place draw cost 12 to 20 ms against 0.056 ms on the base, and an end of 100 new places 1.7 to 2.7 s against 0.3 s, because every attempt''s accepts_value rebuilt every tier through fits before the used check.'
    resolution: 'Fixed in 24b9c86 (tests first 87b3a42), Lionel''s "yes, fix both". _select_location builds its tiers once and keeps an attempt if _place_free (not used, then Story 11.6''s real-name check); accepts_value checks _place_free before the fit. QA re-measured with its own harness (merge_notes, round 2): work 401 to 1, 201 to 1, 501 to 1; a used-up draw 0.17 to 0.25 ms; the end below the base.'
  - id: 'TEST-131-01'
    severity: low
    raised_on: cfa2477
    finding_summary: 'Round 1: P11[batch] and P12[batch] installed no _Dialogs, so a review and end disagreement blocked on the real « Pseudonymes remplacés » dialog until the timeout.'
    resolution: 'Fixed in 87b3a42: _Dialogs(monkeypatch) moved before the case branch in both tests (tests/unit/gui/test_place_word_review.py:87 and :126), so every case installs it. QA: M24 fails its three cases in 2.21 s; P11[batch] alone (M24b) fails at test_place_word_review.py:109, AssertionError (Lyon), in 1.31 s. Story 11.5''s T22 and T25[batch] keep the same gap, outside this story: recorded in the story''s Debug Log and Completion Notes and in this gate''s future list; docs/BACKLOG.md has no entry yet.'

