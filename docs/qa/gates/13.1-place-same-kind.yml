  - 'Round 2, timings (logs/qr2, perf_draw.py and perf_end.py of round 1 unchanged; base, head, cfa2477, base, head back to back; the machine was loaded, so only this session''s numbers are compared). One used-up draw: base 0.055 to 0.059 ms, head 0.170 to 0.245 ms, cfa2477 19.9 ms (no word) and 34.7 ms (« à »). A fresh draw: base 0.007 to 0.013 ms, head 0.070 to 0.078 ms, cfa2477 0.13 to 0.37 ms. N new places one after the other, no word, 50/95/200/400: base 0/1/7/20 ms, head 3/12/37/88 to 89 ms, cfa2477 201/1889/7862/19078 ms. The end, 100 new places in a database already holding 100 (median of 3): after « à » base 277 and 279 ms, head 156 and 155 ms, cfa2477 4528 ms; with « avec » base 802 and 814 ms, head 162 and 163 ms, cfa2477 7439 ms. The base « avec » end read 303 ms in round 1 with the same script; QA has no explanation for the difference, and the head is below the base in both runs. QA''s reading, not measured: the base runs the real-name check before the used check on each of its 100 attempts, the head the used check first.'
  - 'Round 2, behaviour (qr_equiv.py, run on wt_tf and wt_head). A: every name of every tier of draw_tiers, 3 themes x 13 words (none, empty, an unknown word, the 5 epic and 5 Q4 words) x 5 real places (none, vowel, consonant, two « y » forms): 12,270 names, 0 outside fits for its word, 0 refused by accepts_value. B: accepts_value("LOCATION") over every library place plus a fallback and a custom value x 13 words x used or not x refused by the real-name check or not: 13,572 answers, SHA-256 3722e204... on both trees. C: secrets.choice replaced by a seeded random.Random; 120 scenarios (random used sets and real-name checks) x 150 draws with random words and real places: 18,000 draws, 13,854 Location-NNN, 4,647,621 choice calls, SHA-256 c41a1c63... on both trees. D: 4,854 library draws, each checked with accepts_value(value, "LOCATION", place_word=word) right after _select_location: 0 refused (Story 11.5''s one check). The reorder is safe only if the real-name checks are pure: real_name_check (core/custom_pseudonym.py:516) and saved_own_words.py''s whole_check and check only read their inputs.'
  - 'Round 2, why it holds in general: the union of draw_tiers'' tiers for a word does not depend on the real place''s letter class (each word''s branch splits or filters the same lists), so every tier name is in fits(word), which builds the tiers with real_place None. _names reads every key of locations while _flatten_location_list reads three; a name outside the three skips the fit in accepts_value, so the mismatch can only make accepts_value accept more, never refuse a drawn name. The fix changes only library_manager.py; the words the draw and the review''s check receive (ctx.place_words) are unchanged from cfa2477 and covered by P1-P7, P11, P12 and C3.'
  - 'Round 2, mutants (qr_mutants.sh on wt_head, logs/qr/mutants.tsv): the dev''s 47 m lines verbatim from r131/dev/mutants_qr.sh (M1-M44 with M34a and M34b, M24 with its batch case, M24b, M45a, M45b), M45c and M45d from mutants_qr2.sh, and M36 with the base library from 851b37d: 50 entries, every first failing test as the dev''s table; 49 killed, M45a survives (2 passed). QA''s own: Q7 (_place_free without the real-name check) killed, 8 failed, 103 passed, first test_own_word_never_written[finalize]; Q8 and M45e survive (TEST-131-03). Every file restored from a backup and compared; wt_head clean afterwards.'
  - 'Round 2, W8: on 87b3a42 with --runxfail, 2 failed at test_place_word.py:559, AssertionError "401 tier builds for one draw" and "201 tier builds for one draw"; plain run of the two new files 82 passed, 2 xfailed. On 24b9c86, W8 run 20 times in a row: 2 passed each time. It is deterministic by construction: every place is used, so no attempt succeeds whatever secrets.choice returns, and the count is the draw''s own build (1) plus one per fits call (0 on the head, 4 x 100 or 2 x 100 on cfa2477). M45b, M45c and M45d fail it at :551 with 401 and 201.'
