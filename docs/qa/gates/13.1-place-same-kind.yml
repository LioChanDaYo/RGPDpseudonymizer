scope: 'Gate on head cfa2477 (branch story/13.1-place-same-kind, pushed, draft PR #133; base origin/main 851b37d). Tests-first commit f459965. QA folder: rgpd-analysis/r131/qa (scripts and logs, never committed).'
gate: CONCERNS
status_reason: 'Every AC QA can check holds on cfa2477: the words are read and the pools are drawn as Lionel approved, every place path passes the word, the 76 tests-first cases fail at an assert on the base, and all 45 of the dev''s mutant entries are killed. One medium finding: once the default theme''s place names are used up, each place draw is about 350 times slower than before (an end of 100 new places 1.7 to 2.7 s against 0.3 s), which a database of a few dozen business documents reaches.'
reviewer: 'Quinn (Test Architect)'
updated: '2026-11-20T19:21:39Z'

top_issues:
  - id: 'PERF-131-01'
    severity: medium
    finding: 'A place draw whose names are used up costs 12 to 20 ms, against 0.056 ms on the base (QA perf_draw.py, neutral, every place used: no word 19.5 ms, « à » 12.2 ms per draw; base 0.056 ms). Cause, in the diff: _select_location now tries up to 100 draws per tier (4 tiers for no word, so up to 400 attempts where the base made 100), and each attempt calls accepts_value, which builds _flatten_location_list and calls fits, which rebuilds every tier through draw_tiers (about 0.05 ms), before the used-name check. Through the real end (finalize_document, the desktop single and batch end): a document of 100 new places in a database already holding 100 places takes 1,657 ms after « à » and 2,685 ms with no word, against 283 and 303 ms on 851b37d (QA perf_end.py, median of 3). The review''s previews draw each new place too, so a reviewed document pays it twice. Realistic: the 25 dev documents read as one database already hold 77 distinct places (m131y part 5) against 83 names for no word, so a database that has seen a few dozen business documents takes this path for every new place. The story''s cost check covered only the desktop refresh''s reading of words (no AC sets a timing bound), and performance.yaml runs only on main after the merge.'
    suggested_action: 'Inside _select_location the fit check is redundant: every name of draw_tiers fits the word by construction (QA mutant Q6, the draw''s accepts_value without place_word: 109 passed). Skip it there (keep it for _proposal_row), check the used names first, or compute the tiers once per call; then measure a used-up draw again against the base. Lionel decides: fix in this story, or ship and backlog with this number.'
    suggested_owner: dev
  - id: 'TEST-131-01'
    severity: low
    finding: 'P11[batch] and P12[batch] (tests/unit/gui/test_place_word_review.py) do not install Story 11.5''s _Dialogs. When the review and the end disagree, which is exactly what their assertions check for, the batch screen opens the real « Pseudonymes remplacés » dialog (batch.py:1223, ConfirmDialog.informational(...).exec(), a modal loop on the GUI thread) inside batch.run(), before any assertion runs; a batch error dialog (batch.py:966-970) would block the same way. QA reproduced it on a worktree of cfa2477 with M24 and --timeout=60: the stack ends in _show_pseudonyms_changed -> exec(), no pytest summary, 62 s (the process ended by pytest-timeout''s thread method). With _Dialogs(monkeypatch) added to the batch branches (scratch edit, worktree only), the same mutant fails at assert _fits(shown) (AssertionError: Lyon) in 1.4 s. Healthy code passes. pyproject sets no default timeout, so a local run without --timeout would hang. The same pattern is older: Story 11.5''s T22 and T25[batch] install no _Dialogs either.'
    suggested_action: 'Add _Dialogs(monkeypatch) to the batch branches of P11 and P12, and optionally assert no dialog was shown. Story 11.5''s T22 and T25[batch] could get the same line in a later story.'
    suggested_owner: dev
  - id: 'TEST-131-02'
    severity: low
    finding: 'Five QA mutants beyond the story''s table survive the new tests (QA mutants_qa.tsv): Q1, the in-span « d'' »/« l'' » branch of word_before disabled (82 passed); Q2, the in-span lone « A » disabled (82 passed); Q3, draw_words ignoring the cells'' order (82 passed); Q4, refresh_review_proposals without ctx.place_text = None (113 passed, with Story 11.5''s desktop file); Q5, _place_word_of not recording the word it reads (96 passed). Q1 and Q2 are mostly masked: without them the look-back reads no word, whose first tier is the real place''s letter class, which for « d''Ostrelle » already gives vowel cities. The gold dev corpus has 0 prepositions inside a span; the detector''s spans were not checked.'
    suggested_action: 'No change needed for this story. If one of these paths is touched later, add a W1 case with the preposition inside the span for « d'' » and « A », and a two-cell case for the cells'' order.'
    suggested_owner: dev
  - id: 'DOC-131-01'
    severity: low
    finding: 'Three wording points. (1) AC9''s check, git grep over tests/ as a whole, is a search the Rules forbid; the dev and QA ran it on tests/unit/ and tests/integration/ (nothing, rc 1). (2) Fix design 4''s "under 3 %" for the desktop refresh used a model of draw_words that skips mapping_key: 1.6 ms at 10,000 places, where the shipped draw_words takes about 25 ms (QA qa_check.py part D). Measured through the screen on Story 11.5''s documents, one type-change click is the same on the head and the base (10,000 rows: 608/598/689 ms against 615/665/658 ms; empty database: 41 to 46 ms both), so the claim holds for those documents; at 10,000 places the reading is about 25 ms, roughly 4 % of a 0.6 s refresh. (3) docs/architecture/5-internal-module-interfaces.md#5.3 still shows assign_pseudonym without the new keywords, as the story defers.'
    suggested_action: 'Whoever touches the story next may reword AC9 to tests/unit/ and tests/integration/ and correct the refresh figure; the architecture doc in a later docs pass.'
    suggested_owner: sm

