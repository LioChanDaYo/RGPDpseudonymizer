nfr_validation:
  security:
    status: PASS
    notes: 'GDPR Article 17: delete-mapping by name removes every row of the name in one transaction with one ERASURE entry per row; --id reports the rows that remain. No new log event carries entity text (database_converted, database_conversion_failed, database_conversion_rollback_failed, database_format_not_recognised, pseudonym_reassigned_for_type, batch_database_precheck_skipped: counts, versions, types, error classes). The conversion copies encrypted values as stored, decrypts nothing, and runs only after the canary check. The ERASURE entry still keeps the erased name (pre-existing, epic follow-up, CHANGELOG does not claim otherwise).'
  performance:
    status: PASS
    notes: 'One extra indexed query per new (key, type) row (find_all_by_full_name); one extra open (one key derivation) per batch run; the conversion is one table rebuild, once per file (0.0-0.016 s on QA''s file). No detection path changed. performance.yaml fires on main after the merge (core/**, data/**).'
  reliability:
    status: PASS
    notes: 'The conversion is one explicit BEGIN IMMEDIATE transaction on an autocommit connection; QA forced failures after the DROP and RENAME and saw the whole sqlite_master restored and the file reopen normally. Busy timeout 30 s; a second opener waits, re-checks and changes nothing (QA forced the wait). A read-only file, a wrong passphrase and a version/key disagreement change nothing. No file is ever deleted.'
  maintainability:
    status: PASS
    notes: 'One key function (core/mapping_key.py) for the core and the desktop check; named patch points (_ensure_current_schema, _begin_immediate, _write_schema_version); index statements shared by init and conversion; docstrings state the rule. Interface first (MappingRepository), as coding standard 19.1 rule 2 asks.'

judgment_calls:
  a_no_shared_pseudonym_preview_gap: 'CORRECT, no decision needed. The story itself pins that two rows of one key never share a pseudonym (AC1 precision, PO N1); enforcing it in _resolve_pseudonyms is the one place every path (validated, skip_validation, desktop finalize) goes through. The preview gap is not a leak: previews show pseudonyms only and the output replaces every confirmed occurrence (QA probe: no real name left). It is not a new confusion: previews of new rows already never bind the output (0 of 5 trials equal), and the clash case only happens to a new row. Cosmetic follow-up MNT-001.'
  b_version_key_disagreement: 'CORRECT, no decision needed. The story asks for "a clear error" that changes nothing and names no class. DatabaseConversionError lets every caller treat every format stop alike: batch stops before the pool, destroy-table shows the message instead of "wrong passphrase", the desktop swallowers keep every review pending. A CorruptedDatabaseError would have been turned into "wrong passphrase" by destroy-table and skipped by the batch pre-check. QA saw "not recognised" with the file unchanged.'
  c_batch_pre_open: 'CORRECT, no decision needed. It implements AC3''s precision (open once after ensure_database, before the pool). Stopping only on DatabaseConversionError keeps every other open error on its existing per-document path, so no new failure mode appears. QA''s real 3-worker run: one conversion in the parent before any document; read-only file: exit 1 before any document.'
  d_destroy_table_title: 'ACCEPTABLE within G4 (only _verify_passphrase may change). The message is the conversion''s own, nothing is deleted, exit 2. The title and the generic hint are weak, worst for an unrecognised file (needs --skip-passphrase-check): backlog UX-001 for the PM, not Lionel.'

