    - id: 'MW-001'
      severity: high
      finding: 'AC17 (b) and (c) compare a custom pseudonym''s parts split at its last space with the stored parts, but the neutral library has four last names with a space ("Da Silva", "Le Gall", "Da Costa", "Espírito Santo"), stored whole as pseudonym_last. (c) hole: when "Quentrel Zorbalia" is stored with the last part "Da Velmar" (invented, same shape), "Xantor Da Velmar" is ACCEPTED for "Zorbal" and for "Quentrix Zorbal" (split "Xantor Da" / "Velmar", neither equal to "Da Velmar"); a later "Zorbalia a signé avec Zorbal." is written "Da Velmar a signé avec Xantor Da Velmar.": two different people show the same surname, the merge Lionel''s Q2 refuses ("two people would merge in the output") and the Task 7.3 pass criterion "no two names share a pseudonym or a part" (probe D05m x2; it also happened by chance in a random run with a generated "Da Costa"). (b) dead end: for "Quentrix Zorbalia" every two-word pseudonym is refused; the example the message offers, "Xantor Da Velmar", is refused again with the example "Xantor Da Da Velmar" (probe D04m), so AC17 (b)''s "the example is always accepted" fails. Only a one-word pseudonym gets through. About 0.8% of generated last names (4/500), and "Da Silva"/"Da Costa" are common choices for a pseudonym a user types. The same defect makes the PR''s own tests flaky: T9[other_last_name] and T9[one_word_name] type "Xantor <stored pseudonym_last>", T9b[last_name] and T9b[both] expect the example built from it, and the stored part comes from a random generated pseudonym; when it has a space the refusal does not happen (T9) or the example is refused again (T9b). CI on the QA commit 26ebcb0 (run 38730457990, attempt 1): windows-latest job 116407248508 "1 failed, 2462 passed, 3 skipped", T9[other_last_name] at test_custom_pseudonym_review.py:630 (no message shown). Four exposed draws per leg, four legs: about one CI run in eight goes red.'
      suggested_action: 'In core/custom_pseudonym.py treat a stored part that has a space as one unit: (c) in _clash (or before it), also refuse when another real name''s multi-word pseudonym_last P satisfies fold(custom).endswith(" " + fold(P)) or fold(custom) == fold(P) (and the same with startswith for a multi-word pseudonym_first), with that row''s full_name as %2 of text 4, no new text; (b) in _part_refusal, accept when the bound last part B has a space and fold(custom).endswith(" " + fold(B)), and in split_custom_pseudonym/custom_entity_fields split before B in that case so pseudonym_last == B. Part (b) refines Q4''s "split at the last space": Lionel to confirm before the dev changes it. Tests: D05m and D04m''s shapes with invented "Da Velmar" (refused; example accepted and stored with pseudonym_last "Da Velmar"). The fix also removes the T9/T9b flakiness; the dev may in addition give T9 and T9b fixed stored parts (as QA''s probes do) so that they no longer depend on the random draw.'
      refs: ['gdpr_pseudonymizer/core/custom_pseudonym.py:100-113', 'gdpr_pseudonymizer/core/custom_pseudonym.py:150-185', 'gdpr_pseudonymizer/core/custom_pseudonym.py:262-302', 'gdpr_pseudonymizer/core/custom_pseudonym.py:375-402', 'gdpr_pseudonymizer/resources/pseudonyms/neutral.json']
      suggested_owner: po
    - id: 'GUARD-001'
      severity: medium
      finding: 'Regression against main in a narrow, plausible path. "Changer le pseudonyme" on a lone first name whose dialog is pre-filled with its stored part ("Quentrel" -> "Quorix", from "Quentrel Zorbalia" stored as "Quorix Velmar"), confirmed as is, stores a one-word custom row ("Quentrel", PERSON, "Quorix", no parts, theme custom), so untracked_custom_values marks "quorix" as untracked. "Quorix" is in fact tracked: it is the same real word''s own part. A later "Quentrel Zorbix a signé. Le contrat est avec Quentrel." then has its compositional pseudonym ("Quorix <last>", shown in the review) redrawn without component links: written "Jérémie Sanchez a signé. Le contrat est avec Quorix." (main writes "Quorix Gonçalves a signé. Le contrat est avec Quorix."); the stored row of "Quentrel Zorbix" has no parts; the list preview and the file differ. Same for a lone last name ("Zorbalia" -> "Velmar": "Clarence Gerard ... avec Velmar" vs main "Erin Velmar ... avec Velmar"). Probe D12 x2 on the head and on main. Story 2.8''s "one real name, one part" consistency is lost for every later full name with that first or last name; nothing leaks.'
      suggested_action: 'core/custom_pseudonym.py untracked_custom_values: do not add a one-word custom pseudonym_full when it equals (folded) the part the same real word already has in the rows given (a PERSON row with first_name == full_name and that pseudonym_first, or last_name == full_name and that pseudonym_last); core/document_processor.py _register_custom_pseudonyms: call it with the stored rows plus the new row (untracked_custom_values([*stored, row])) instead of [row]. Test: lone "Quentrel" set to its stored part, then "Quentrel Zorbix" written with that part first and its row bound.'
      refs: ['gdpr_pseudonymizer/core/custom_pseudonym.py:405-424', 'gdpr_pseudonymizer/core/document_processor.py:467', 'gdpr_pseudonymizer/core/document_processor.py:624-635']
      suggested_owner: dev
    - id: 'PERF-001'
      severity: low
      finding: '_capitalised_occurrence tokenizes and folds the whole document for each candidate (the pseudonym and its two parts), and finalization re-checks every custom pseudonym. Measured (tools/perf_check.py, invented data): 5000 rows, 140k-word document: find_all 0.25 s, one set-time check 0.78 s, finalization re-check of 20 custom pseudonyms 16 s. Realistic documents (a few thousand words, a few custom pseudonyms) stay well under a second.'
      suggested_action: 'Backlog, or with MW-001: fold and tokenize the document once per check (or once per finalization) and pass the token list in.'
      refs: ['gdpr_pseudonymizer/core/custom_pseudonym.py:203-233', 'gdpr_pseudonymizer/core/document_processor.py:441-454']
      suggested_owner: dev
