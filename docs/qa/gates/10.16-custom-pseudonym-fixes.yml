    finding: 'Round 2, measured on real output (QA probe test_qa_1016_limit.py, 463481a vs 4002fcd): NFC changes one class of decisions from refused to accepted, fragments the old cut made into words. Next to « quentrel zórbalia » written decomposed, "Rbalia Xantor" was refused at 463481a (« zo » + mark + « rbalia » gave the word « rbalia ») and is accepted at the head, as it is next to the composed spelling at both commits (L6 = L7). This is AC1''s rule (whole words): no whole word of a name is accepted that was refused before. The no-composed-letter limit (follow-up f, Story 10.20) is unchanged: L1 « zox » + U+0301 + « rbalia » vs "Xantor Zoxrbalia" accepted, L2 the reverse accepted, L3 both with the mark refused, L5 accepted, on both commits; L4 (« zó » decomposed + « x » + U+0301 + « rbalia » vs "Xantor Zó" composed + « x » + U+0301 + « rbalia ») accepted at 463481a and refused at the head.'
