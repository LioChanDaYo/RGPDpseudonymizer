top_issues:
  - id: 'TEST-001'
    severity: low
    finding: 'Two AC1 rules hold but no committed test pins them: "the name it replaces is always among the names" and the desktop names read each row''s correction. QA mutants Q02 (the name not added to the names) and Q18 (_review_names reads the detected entity, not _edited_entity) pass all 341 committed tests and QA''s 27 probes: on every committed path the name is also a review name (T1/T9[whole_name, surname], T3[own_surname]), and no test corrects a row into a lowercase name before setting a pseudonym (T15[corrected_into] corrects after). If either regressed, the refusal would move from set time to finalization (the document fails with the new reason; in the command line the review is lost); no name in clear. QA probes n1 (command line [R], [P], [C] with the name''s own surname), n2 (desktop, the row rejected, then its own surname) and n6 (desktop, « zorba » corrected into « zorbal », then "Xantor Zorbal") catch them and pass at the head.'
    suggested_action: 'Dev (backlog, or before merge at the orchestrator''s call): add the three cases to T1/T9 with invented names.'
    refs: ['gdpr_pseudonymizer/core/custom_pseudonym.py:573', 'gdpr_pseudonymizer/gui/models/validation_state.py:909', 'tests/unit/test_custom_pseudonym_fixes_cli.py', 'tests/unit/gui/test_custom_pseudonym_fixes_review.py']
    suggested_owner: dev
  - id: 'TEST-002'
    severity: low
    finding: 'In the command line, "a rejected name does not count" is not pinned: QA mutant Q05 (validation/workflow.py _review_names keeps rejected reviews) passes everything committed; the desktop''s T11[rejected_name] has no command-line twin. If it regressed, the command line would wrongly refuse a pseudonym next to a rejected lowercase name (no leak). QA probe n3 ([R] « quentrix », then [C] "Xantor Quentrix": no warning, "quentrix a signé avec Xantor Quentrix.") catches it.'
    suggested_action: 'Dev (backlog): a command-line twin of T11[rejected_name].'
    refs: ['gdpr_pseudonymizer/validation/workflow.py:530', 'tests/unit/test_custom_pseudonym_fixes_cli.py']
    suggested_owner: dev
  - id: 'TEST-003'
    severity: low
    finding: 'takes_custom_value''s whole-value clause is not pinned: QA mutant Q13 (the clause dropped) passes everything committed. The library refuses the same spelling (the custom pseudonym is marked used), so only another spelling reaches the clause. Under Q13, a place offered "Xántor Véllion" at finalization is written "Le contrat est signé à Xántor Véllion." next to the person''s "Xantor Vellion" (two names read alike; no name in clear). QA probe n5 catches it; at the head the draw is redone.'
    suggested_action: 'Dev (backlog): a T5 case for a place or an organisation.'
    refs: ['gdpr_pseudonymizer/core/custom_pseudonym.py:723-748', 'tests/unit/test_custom_pseudonym_fixes_cli.py']
    suggested_owner: dev
  - id: 'PERF-002'
    severity: low
    finding: 'Finalization tokenizes every name sent once per custom pseudonym (check_custom_pseudonym reads [name, *review_names] at each call): finalize_document 0.60 s vs 0.39 s on main''s code at 400 names and 40 custom pseudonyms, 4.85-4.94 s vs 2.06-2.11 s at 1500 names and 150; unchanged without a custom pseudonym (0.36 vs 0.37 s; 1.44 vs 1.45 s). One set-time check against 1500 review names: 0.024 s. Invisible at review sizes.'
    suggested_action: 'Backlog (10.11 PERF-001''s owner): tokenize the names sent once in _register_custom_pseudonyms, as the document''s words already are.'
    refs: ['gdpr_pseudonymizer/core/custom_pseudonym.py:573-577', 'gdpr_pseudonymizer/core/document_processor.py:547']
    suggested_owner: dev
  - id: 'DOC-001'
    severity: low
    finding: 'The PR body''s "The rebased head: not yet read" is now known: run 39446561086 on ae7efc4, attempt 1, ubuntu 3.11 and 3.10 and macOS "2840 passed", windows "2691 passed, 3 skipped", 0 XFAIL, lint green, exactly the counts the body expects. The PR is still a draft (isDraft true) while the story says Ready for Review; Tasks 6.2 (CI green on the head, now true) and 6.5 are unchecked.'
    suggested_action: 'Orchestrator or dev: put the head run in the PR body, check Task 6.2, mark the PR Ready for Review (Task 6.5).'
    refs: ['https://github.com/LioChanDaYo/RGPDpseudonymizer/pull/109']
    suggested_owner: dev
  - id: 'OBS-001'
    severity: info
    finding: 'Not 10.16 (the unfixed code writes the same): the single-document review shows « Quentrel Zorbalia » and « M. Quentrel Zorbalia » as one row. A correction of that row to « Quentrel Zorbalia Quovan » (or a type change to ORG) is sent at both places with the corrected text, and the titled place is written without its title: "Xantor Vellion a signé le contrat. Le contrat est avec Xantor Vellion." (probe g6). Nothing is left in clear; only "M." is lost. 10.9''s every-occurrence correction rule.'
    suggested_action: 'Backlog note only, if Lionel wants titles kept after a correction in single-document review.'
    refs: ['gdpr_pseudonymizer/gui/models/validation_state.py']
    suggested_owner: po

