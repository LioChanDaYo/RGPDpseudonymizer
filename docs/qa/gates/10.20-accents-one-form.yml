top_issues:
  - id: 'SEARCH-001'
    severity: medium
    finding: 'The three searches with a person''s full name do not list rows an earlier version saved with lost letters: « lora Quentrel » after a lone U+0301 (for « Mélora Quentrel »), « JérôQuentrel » (for « Jérôme Quentrel ») and « Maître » + lone U+0301 + « lora Quentrel » (decomposed). list-entities --search "Mélora Quentrel" and list-mappings --search give « No entities found » / no row; the desktop database search shows 0 rows. 7 of the PO''s and SM''s 24 old databases (v220_melora, base_melora, v220_jerome, base_jerome, v220_maitre_melora, base_maitre_melora, v220_mangled). Reuse and delete-mapping by the full name reach the same rows (24 of 24), and a part of the name (« Quentrel ») lists them. AC3 lists the searches among the comparisons and says « So a database written by v2.2.0 or by today''s code still matches, with both kinds of old row »; Lionel''s Qa says « each time the app looks for a saved name, it also looks for the ways an earlier version could have saved it »; the CHANGELOG says such names « are still found, reused and erased ». The Fix Design (search_entities compares composed forms) and Consumer Trace row 22 (substring of composed forms) did not carry the former forms into the searches.'
    reproduction: 'r1020/qa/probes/test_q20_olddbs.py::test_old_row_found_by_search_with_the_bare_name[po/dbs/v220_melora.db] (and the six others); test_q20_desktop.py::test_d5_database_screen_search (mangled_row_typed_full_C: 0).'
    suggested_action: 'Decision for the orchestrator, the PO and Lionel: (a) the dev makes search_entities, list-mappings, the database screen and its worker also try the search text''s former forms (former_keys) as substrings, with tests; or (b) the limit is accepted and the CHANGELOG says the searches find such names by a part of the name.'
    refs: ['gdpr_pseudonymizer/data/repositories/mapping_repository.py:577-590', 'gdpr_pseudonymizer/cli/commands/list_mappings.py:133-142', 'gdpr_pseudonymizer/gui/screens/database.py:570-585', 'gdpr_pseudonymizer/gui/workers/database_worker.py:230-238', 'CHANGELOG.md']
    suggested_owner: po
  - id: 'TEST-001'
    severity: low
    finding: 'Six behaviours that hold on real output are pinned by no committed test; QA mutants survive the 615 committed tests of the path: M08 (a passphrase composed in init_database and open_database; AC13), M23 (list-mappings --search typed decomposed not composed), M25 (import-mappings saving the names as read), M27 (the desktop correction dialog not composing), M33 (find_by_component exact), M19 (_locate_modified_span''s mark check dropped; reachable only with a mark that has no composed letter). QA probes catch the first five: test_q20_cli.py e8 and e7[C-D], test_q20_gaps.py g1, test_q20_desktop.py d2[decomposed-*], test_q20_component.py.'
