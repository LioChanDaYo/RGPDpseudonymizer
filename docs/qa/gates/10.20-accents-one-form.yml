top_issues:
  - id: 'SEARCH-002'
    severity: low
    finding: 'On a clean database (rows as today''s code writes them), a search typed « Mé », either way, now also lists « Zox » + lone U+0301 + « rbalia Quentrel », a name whose mark has no composed letter, which NFC keeps. The cause: decomposed, « Mé » is « Me » + a mark; the title pattern takes « Me » off, so one of its former forms is the lone U+0301 alone, a substring of any such name. The same holds for any search led by « Mé », « Mè », « Mê », « Më » or « Mmé ». « Mél » gives a lone U+0301 + « l », so a longer search narrows at once. AC13 says a typed name and a saved name written the usual way are « compared … exactly as today »; 87cd011 does not list that row. Nothing is written or erased; French names do not use such letters, while names from other languages can. The other lines that move on QA''s clean database are on an organisation « Maître Vorlan », a row today''s code cannot write (titles are stripped everywhere, for every type). So they show only on old rows, as the Fix Design intends.'
    reproduction: 'r1020/qa/probes/test_q20_search.py::test_s2_clean_database_results, lines « Mé » C and D (logs/s2_head.txt against logs/s2_base.txt).'
    suggested_action: 'Decision for the orchestrator, the PO and Lionel: (a) the dev: a former form that begins with a mark counts only where the mark does not follow a letter in the saved name, with a test; or (b) accept the corner (waiver, backlog).'
    refs: ['gdpr_pseudonymizer/core/mapping_key.py:100-125']
    suggested_owner: po
  - id: 'TEST-002'
    severity: low
    finding: 'Two behaviours that hold at the head are pinned by no committed test; QA mutants survive all 636 committed tests of the path. (1) The forms of the row''s own type: F03 x4 (a PERSON''s forms for every row), F04 x4 (a LOCATION''s), F10 (a LOCATION''s former keys taken as a PERSON''s) and F11 (the own key taken as a PERSON''s, so « à Zórbaville » would list every « Zórbaville »; G13 tests a PERSON only). (2) The pseudonym half of list-entities and list-mappings --search typed decomposed: P1 and M23 as written. search_forms now composes the name half itself, so G9 catches the full-raw variant (R23b) but not M23''s edit, which only reaches the pseudonym comparison. QA''s probes catch each: S2 (F04, F11), S4 « de Mézorville » (F03, F10), S5 (P1, M23).'
    suggested_action: 'Backlog: a LOCATION twin of G13; S4''s « de Mézorville » row; a pseudonym typed decomposed in T17''s searches.'
    refs: ['tests/unit/test_accents_one_form_cli.py', 'tests/unit/gui/test_accents_one_form_desktop.py']
