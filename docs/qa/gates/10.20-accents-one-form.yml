    refs: ['tests/unit/test_accents_one_form_cli.py', 'tests/unit/gui/test_accents_one_form_desktop.py']
    suggested_owner: dev
  - id: 'DOC-001'
    severity: low
    finding: 'The PR body still says « This draft holds the tests-first commit only » and gives that commit''s expected CI; it lacks the fix and head runs (39682995567, 39686908296), the AC7 run (39688923947) with its lines, and the Codex review; the PR is still a draft. Noted, not edited.'
