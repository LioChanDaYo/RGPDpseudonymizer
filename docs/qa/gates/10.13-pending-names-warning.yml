    suggested_owner: dev
  - id: 'TEST-002'
    severity: low
    finding: 'No committed test pins sent_without_review being passed on when "No" at "Ready to process" restarts the review. QA mutant M8 (the "No" restart drops it) passes the 18 new tests and test_validation_ui.py, test_validation_models.py and test_validation_workflow_integration.py (90 tests). Effect: after "No", a place covered by a name known in the database is counted, and the second summary shows a false "⚠ Still to review: 1" (an over-warning, not a leak). QA probe QC6 catches it. The same restart calls are where Story 10.15''s rebase conflict is expected.'
