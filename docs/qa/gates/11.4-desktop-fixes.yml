merge_notes:
  - 'Status still reads Approved (v1.4), not Review as the review task expects. QA did not change it (not QA''s section).'
  - 'Task 5.4 read by QA: CI on 4027cfd (run 43007121516) ubuntu 3.11, ubuntu 3.13, macOS 3.12 3415 passed; Windows 3.12 3265 passed, 3 skipped; 0 xfailed; lint, quality, CodeQL pass. Equal to the dev''s expectation.'
  - 'Installers: build-executables run 43007249031 (workflow_dispatch, version dev, on 4027cfd) green on all three build jobs (upload-release skipped, tags only). Each job logs "Installing the current project: gdpr-pseudonymizer (2.3.1)". No PyInstaller warning mentions gdpr-pseudonymizer, copy_metadata or dist-info (only the usual hidden-import and, on Linux, Qt xcb library warnings). copy_metadata raises at build time when the package is missing, so a green build means the dist-info was found. QA inspected the Linux artifact without running it (unsquashfs at offset 193728 of gdpr-pseudonymizer-dev-linux.AppImage): _internal/gdpr_pseudonymizer-2.3.1.dist-info/METADATA reads "Name: gdpr-pseudonymizer", "Version: 2.3.1", next to _internal/readchar-4.2.2.dist-info, whose version lookup already works in shipped builds. So the installer named "dev" carries 2.3.1, and the frozen app''s importlib.metadata reads 2.3.1. macOS and Windows bundles not opened: they rest on the same spec and their clean logs.'
  - 'Which version a build shows: the app reads the bundled dist-info, which carries pyproject.toml''s version at the built commit. The workflow''s version input (dev, or the tag) only names the installer files. So this dev build shows 2.3.1, and a v2.3.1 tag on a commit whose pyproject.toml says 2.3.1 shows 2.3.1. A tag pushed without bumping pyproject.toml would show the old version: a release-process point, not a finding here.'
  - 'Not findings (outside the premise or no realistic user): a damaged salt or iteration count in the metadata raises ValueError in open_database, so the start check shows W-MSGBAD and forgets the cache, exactly as DatabaseWorker does today; typing only spaces (fewer than 12) shows the 12-character label while Continuer is disabled anyway, a true text.'
  - 'This gate file and the story''s QA Results are the expected exception to AC11''s file list (QA''s own outputs).'
  - 'QA started no Codex, Forge, Anvil or Cato process. Codex (Task 7.1) is the orchestrator''s.'

