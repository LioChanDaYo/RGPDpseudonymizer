  fix_design_check: 'exclusive create os.open(O_CREAT|O_EXCL|O_WRONLY, 0o644) after the key derivation (database.py:182, helper :69-84); FileExistsError raises the unchanged "Database already exists" ValueError chained from it, and any other OSError raises the wrapped Exception, both before the try; the try is the next statement; the descriptor is held to the end and closed after engine.dispose() on success (finally) and after the dispose and identity check on failure (inner finally); cleanup order: dispose, identity (samestat of fstat(fd) and stat(db_path), False on OSError), close, then os.unlink of the main file and then the -wal, -shm and -journal files, only if ours; the first error stops the delete step, so sidecars go only with our own main file; dispose and delete errors are logged once as database_init_cleanup_failed with step and error_type only, never replacing the original; Exception is wrapped as before, and KeyboardInterrupt/SystemExit are re-raised unwrapped by a bare raise; schema_version stays "1.0.0" and the four metadata keys are untouched (the metadata block is not in the diff); open_database and every caller are unchanged'
  dev_deviations: '(1) a missing main file is fine at cleanup: matters only if a third party deletes the file between the identity check and the delete; acceptable. (2) the harness also fails on a child that exited non-zero: stricter, fine. (3) a missing directory now reports the OS error, including the path, instead of SQLite''s "unable to open database file"; same type and prefix, the callers behave as before. The existing "already exists" message already carries the path. (4) PASS_A, PASS_B and _assert_winner_db live in test_database.py and are imported by the concurrency test: one place to change for 10.7'
