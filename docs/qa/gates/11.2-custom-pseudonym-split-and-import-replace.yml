top_issues:
  - id: 'SPLIT-112-01'
    severity: low
    finding: 'Two people of one document share « Élodie »; the user gives « Élodie Martin » « Aurore de Sousa » and « Élodie Dupont » « Aurore de La Fontaine ». Both are accepted at set time in either order and finalization writes both in either dict order, but the stored rows give « Élodie » two first-name parts: Martin (Aurore, de Sousa), Dupont (Aurore de, La Fontaine). Same with « Aurore De Sousa », and with « Aurore Van Damme » next to « Aurore van der Berg » (Aurore van, der Berg). Cause: _bound_parts splits the pseudonym under check with the stored parts only to build the hint; under D1 « Aurore de La Fontaine » alone gives « Aurore de » (KL-007''s split), and « Aurore de Sousa » starts with « Aurore de », so the Fontaine check sees Sousa as (Aurore de, Sousa) while the Sousa check sees Fontaine as (Aurore, de La Fontaine). Each check is order-independent, but the two names'' views disagree. At 047717f the same pair was refused. Next: a later lone « Élodie » is written « Aurore » here (the first stored part read wins), so no name in clear and nothing odd shown in this run; which of the two parts binds later names depends on which stored row is read first (not measured further). Not reproduced with single linking words: « Aurore Le Goff » next to « Aurore de La Fontaine » stores (Aurore, de La Fontaine), and next to « Aurore de Sousa » (Aurore, Le Goff)/(Aurore, de Sousa). Realism: needs a shared real first name, two custom pseudonyms, a double-particle surname and the other surname starting with the same linking word; rarer than KL-007 alone, which was backlogged as rare. Outside the story''s premise (stopping rule item 5).'
    suggested_action: 'Orchestrator: tell Lionel; if he wants, extend KL-007''s text to this case (its pull trigger stays a user report). No code change in this story.'
    refs: ['gdpr_pseudonymizer/core/custom_pseudonym.py:475-515', 'docs/BACKLOG.md (KL-007)', 'rgpd-analysis/r112/qa/logs/qa112_k.log']
    suggested_owner: po
  - id: 'DOC-112-01'
    severity: low
    finding: 'Task 2.4 ("push ... STOP A") is unticked; the Debug Log''s "Task 2.4 / STOP A" entry records it done (commits 9a8e3bf and badda97 pushed, PR #120 opened by the orchestrator, CI run 42264348421 read).'
    suggested_action: 'Orchestrator or dev: tick Task 2.4.'
    refs: ['docs/stories/11.2.custom-pseudonym-split-and-import-replace.story.md']
    suggested_owner: dev
  - id: 'MNT-112-01'
    severity: low
    finding: 'custom_entity_fields'' docstring line 733 is 105 characters ("(Story 11.2), as ``check_custom_pseudonym`` splits them. On a one-word name the last part has no real"); the file had no line over 88 at 047717f. black does not wrap docstrings and ruff ignores E501, so every check is green. Cosmetic.'
    suggested_action: 'Rewrap if the file is touched again.'
    refs: ['gdpr_pseudonymizer/core/custom_pseudonym.py:733']
    suggested_owner: dev
  - id: 'TEST-112-01'
    severity: info
    finding: 'QA in-process mutants on the final tests (logs/mut_*.log): M1 (order fix reverted) is caught only by T20 (2 cases): D1 alone already fixes the « Dravin Le Vorlan » pair, as the story planned ("T20 pins AC1''s change on its own"). M5 (the hint overwrites a stored part instead of setdefault) survives all 103 cases; it differs only when the pseudonym under check does not start with its stored part, which Q-D then refuses anyway with the same required part, so it is equivalent in practice.'
    suggested_action: 'None.'
    refs: ['tests/unit/test_custom_pseudonym_refused_at_finalization.py']
    suggested_owner: po
  - id: 'OBS-112-01'
    severity: info
    finding: 'Not new: when the set-time check is bypassed (finalize_document called directly with two different first-name parts for one first name, e.g. « Aurore Le Goff » / « Claire Le Goff » on an empty database), finalization fails with the "different part in the mapping database" text. Same at 047717f. CLI and desktop never reach it: the set-time check refuses the second pseudonym first (QA probe C_diff_first_*). The text stays true for its remaining cause (T7).'
    suggested_action: 'None.'
    refs: ['gdpr_pseudonymizer/core/custom_pseudonym.py']
    suggested_owner: po
  - id: 'OBS-112-02'
    severity: info
    finding: 'By design: a target row saved decomposed (« Hélène Dupont » NFD, an older version) replaced from a composed source keeps its NFD full_name bytes and takes the source''s composed first_name. Both are compared folded (fold uses NFKD), and a later document with the composed name gets the new pseudonym (QA probe NFD: "Anouk Xavier a appelé.", 1 row).'
    suggested_action: 'None.'
