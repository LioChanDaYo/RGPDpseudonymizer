top_issues:
  - id: 'MNT-001'
    severity: low
    finding: 'The place pattern holds U+2010 and U+2011 as literal characters (validation/models.py:24-25, bytes E2 80 90 and E2 80 91), which most editors show as an ordinary hyphen or nothing. The Fix Design wrote them as \u2010 and \u2011. Behaviour is right (QA probe: "Zorbal‐Quentrix" and "Quentrix‑Zorbal" hold no place of "Zorbal").'
    suggested_action: 'Optional: write r"(?<![\w\-\u2010\u2011])" and r"(?![\w\-\u2010\u2011])"; re reads \uXXXX inside a raw string, so the pattern is the same and visible.'
    refs: ['gdpr_pseudonymizer/validation/models.py:24-25']
    suggested_owner: dev
  - id: 'TEST-003'
    severity: low
    finding: 'No committed test needs the widening''s fixed point. QA mutant MC (one outer pass only) passes the 52 new tests and 197 existing tests of the changed area. The case it breaks: a correction widened over an accepted name that itself partly overlaps a stored name ("ok Zorbal Quentrix Vorlan Mestrix a signé.", "Zorbal" corrected to "Zorbal Quentrix", "Quentrix Vorlan" accepted, "Vorlan Mestrix" stored). Under MC the output is "ok <ZQ''s pseudonym> Mestrix a signé.", exit 0 with "Processing Successful", while "Vorlan Mestrix" has a stored row. At 210cf1d it is "ok <ZQ''s pseudonym> a signé." (QA probe test_qa_fixed_point_through_two_overlapping_names, .txt and .xlsx). It needs two written names that partly overlap each other, which detection rarely gives; the product is right, the gap is regression protection only.'
    suggested_action: 'Backlog, by the BMAD dev agent: a test like QA probe test_qa_fixed_point_through_two_overlapping_names (r1015/qa/probes/test_qa_1015_v15.py).'
    refs: ['gdpr_pseudonymizer/core/document_processor.py:437-455']
    suggested_owner: dev
  - id: 'TEST-004'
    severity: low
    finding: 'No committed test pins the tie rule of the ruling ("first in the list sent") for two typed places that partly overlap each other. QA mutants MD (equal widened spans go to the later place) and MD2 (typed places processed last to first) pass the 249 tests of the changed area. Under MD2, two overlapping corrections ("Vorlan" corrected to "Vorlan Zorbal", "Quentrix" to "Zorbal Quentrix") are written with the second correction''s pseudonym instead of the first''s. Nothing is left in clear either way; only which typed name''s pseudonym covers the span changes. QA probes test_qa_two_corrections_overlap (.txt, .xlsx, .csv) and test_qa_tie_first_in_list (.txt, .xlsx) catch both.'
    suggested_action: 'Backlog, by the BMAD dev agent: a test like QA probe test_qa_two_corrections_overlap.'
    refs: ['gdpr_pseudonymizer/core/document_processor.py:437-463']
    suggested_owner: dev
  - id: 'MNT-002'
    severity: low
    finding: 'The _widen_added_places docstring (and the story''s Fix Design item 3) say that two typed places that partly overlap each other "end with the same span" and the writer keeps the first. In the common case they do not: the first typed place in the list widens over the second, which it then holds, so the second keeps its span; the first wins because its span is the longer one. Equal spans only arise in chains through a third name (QA probe test_qa_tie_first_in_list). The outcome matches the ruling (the first in the list gives the pseudonym) in both cases.'
    suggested_action: 'Optional: reword the docstring to "the first typed place in the list widens over the second and covers it; where both end with the same span, the writer keeps the first".'
    refs: ['gdpr_pseudonymizer/core/document_processor.py:416-430']
    suggested_owner: dev

