    suggested_action: 'Optional: write r"(?<![\w\-\u2010\u2011])" and r"(?![\w\-\u2010\u2011])"; re reads \uXXXX inside a raw string, so the pattern is the same and visible.'
    refs: ['gdpr_pseudonymizer/validation/models.py:24-25']
    suggested_owner: dev

