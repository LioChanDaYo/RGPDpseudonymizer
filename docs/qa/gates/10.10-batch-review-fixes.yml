nfr_validation:
  security:
    status: PASS
    notes: 'The leak paths are closed: a list built on one document is never stored for or sent as the result of another (refusal plus identity guard); decisions survive navigation; a hand-added row''s accept or reject never touches detected rows; a correction reaches every place of the name except places rejected on their own; group actions keep decisions made on one place. Every probe file holds no name part except places the user rejected. The new log line carries two indices only.'
  performance:
    status: PASS
    notes: 'One review state per shown document for the run (the context cache already holds the text); a re-attach is cheaper than the old rebuild (no database open for the known-entity pass). Deciding which rows an action passes over takes one set lookup per row.'
  reliability:
    status: PASS
    notes: 'Undo and redo restore states, types and each row''s memory exactly, across navigation; a refused click leaves the worker waiting and the batch finishable from its waiting document; cancel, a read error and a finalization error behave. No harness timeout in any probe at the head.'
  maintainability:
    status: PASS
    notes: 'Small private helpers with docstrings citing Lionel''s answers; the memory lives in GUIValidationState, not the shared core model; mypy strict clean on the head and on the merge with 10.7.'

