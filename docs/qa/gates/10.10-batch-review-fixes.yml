top_issues:
  - id: 'OBS-001'
    severity: low
    finding: 'Pre-existing, not a 10.10 regression. BatchScreen._validation_results keeps the very DetectedEntity objects of the document''s review (get_validated_entities returns review.entity for every row that is not edited, validation_state.py:662-682), so a change made on an earlier document (A1: shown, not applied) also changes that document''s stored list. QA probe R5: after "Modifier le texte" on doc 0, _validation_results[0] reads ORG (0, 12) instead of (0, 10). The written file does not change (the worker finalized doc 0 before doc 1 was shown) and _validation_results has no reader in gdpr_pseudonymizer/ (Consumer Trace #13). The unfixed code shows the same (its rebuilt state reused the stored list).'
    suggested_action: 'Backlog only: if a reader of _validation_results is ever added, store a copy (for example [dataclasses.replace(e) for e in entity_list] at batch.py:954).'
    refs: ['gdpr_pseudonymizer/gui/screens/batch.py:954', 'gdpr_pseudonymizer/gui/models/validation_state.py:662-682']
    suggested_owner: dev
  - id: 'OBS-002'
    severity: low
    finding: 'Pre-existing, outside 10.10''s ACs. In a batch where a document fails to read (continue on error), "◀ Précédent" on the next document is shown and enabled but does nothing: _on_prev_doc only looks for the cached context of doc_index - 1 (validation.py:804-822), and the unreadable document has none. QA probe R7: on doc 2, the click stays on doc 2; doc 0 and doc 2 are written from their own decisions, doc 1 has no output and the summary says "Erreur". No leak.'
    suggested_action: 'Backlog: let "Précédent" skip to the nearest earlier document with a cached context, or hide it when there is none.'
    refs: ['gdpr_pseudonymizer/gui/screens/validation.py:804-822', 'gdpr_pseudonymizer/gui/screens/validation.py:860-882']
    suggested_owner: po
  - id: 'TEST-001'
    severity: low
    finding: 'T12 answers the single document''s confirmation with "no", so it never checks that the single document opened while a batch waits is written. QA probes R10 (Ctrl+O, the recent-files menu, and the home screen reached by "◀ Retour") and R12 (after a batch) finalize it through the real FinalizationWorker: written clean, one pseudonym, and the waiting batch document then written from its own list with its decisions kept.'
    suggested_action: 'Optional, next time the file is edited: answer "yes" in T12 and assert the single document''s pseudonymized content. Not a merge condition.'
    refs: ['tests/unit/gui/test_batch_review_real_worker.py:559-604']
    suggested_owner: dev
  - id: 'TEST-ENV-001'
    severity: low
    finding: 'Known since 10.9 and recorded by the dev: tests/integration/test_ner_title_improvements.py reads tests/test_corpus/interview_transcripts/interview_05.txt (main corpus) relative to the working folder, so a run from a scratch folder reports 4 errors. CI runs from the repository root and is not affected; the file run from the worktree: 7 passed.'
    suggested_action: 'Backlog: build the path from the test file''s location.'
    refs: ['tests/integration/test_ner_title_improvements.py']
    suggested_owner: dev

