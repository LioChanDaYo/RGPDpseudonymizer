top_issues:
  - id: 'PERF-001'
    severity: low
    finding: 'W-JOIN checks membership with a value-equality list scan (`entity not in out`) for every PERSON, so it is O(PERSON x entities). QA measure: 1k entities 0.05 s, 4k 0.72 s, 8k 2.97 s. Invisible at NFR1 sizes; quadratic on very long documents.'
    suggested_action: 'Track removed entities in a set of id() values. Small follow-up PR, with no metric change expected.'
    refs: ['gdpr_pseudonymizer/nlp/hybrid_detector.py:626']
    suggested_owner: dev
  - id: 'REL-001'
    severity: low
    finding: 'A W-JOIN span keeps its line break ("Zorbalia\nQuentrix"). The mapping key (strip_titles, no whitespace collapse) therefore differs from the one-line spelling, so one person can get two pseudonyms in one document, and the output replaces the line break too. Fires 0 times on the main corpus.'
    suggested_action: 'Collapse whitespace in the mapping-key normalization. This is a key change, so it needs a story with a continuity note.'
    refs: ['gdpr_pseudonymizer/nlp/hybrid_detector.py:603-666', 'gdpr_pseudonymizer/core/document_processor.py:211-227']
    suggested_owner: po
  - id: 'REL-002'
    severity: low
    finding: 'By design since 10.2: the C2 trim still drops the tail after the first line break of a containment outer span, and that tail can hold a name. In QA fuzz (4,000 split + join documents) C2 is the only source of upper-case name-character loss; there are 0 losses with C2 neutralised. R-SPLIT late now cuts multi-line spans into covered pieces, so the tail drop is no longer needed.'
    suggested_action: 'Dry-run "C2 tail drop off, R-SPLIT handles the line" against run 37459114468 in 10.3b/10.3c, and have Lionel decide.'
    refs: ['gdpr_pseudonymizer/nlp/hybrid_detector.py:997']
    suggested_owner: po
  - id: 'REQ-001'
    severity: low
    finding: 'R-ORG shape limits can leave part of a real organisation name uncovered where the old run-on span covered it: 7+ tokens (the first token is lost), "& Co." with a period (the following word is lost), 3+ connectors, and an elision right after a prefix keyword ("Chambre d''Zorbal ..." gives no ORG span). The last case contradicts the Task 3.2 and Candidate Rules examples. 0 cases on the main corpus; within the signed-off level-1 exceptions.'
    suggested_action: 'Record these for 10.4 / F10 (ORG recall) and correct the "Chambre d''Agriculture" example in the story.'
    refs: ['gdpr_pseudonymizer/resources/detection_patterns.yaml:77', 'gdpr_pseudonymizer/resources/detection_patterns.yaml:88', 'docs/stories/10.3a.boundaries-run-on-spans.story.md:109', 'docs/stories/10.3a.boundaries-run-on-spans.story.md:507']
    suggested_owner: po
  - id: 'DOC-001'
    severity: low
    finding: 'The story still says hard-wrapped names are "not fixed", although decision 11 fixed them (W-JOIN). Frozen Rules are numbered 1-5, 7, 8, 6.'
    suggested_action: 'Refresh those sections.'
    refs: ['docs/stories/10.3a.boundaries-run-on-spans.story.md:365-367', 'docs/stories/10.3a.boundaries-run-on-spans.story.md:515', 'docs/stories/10.3a.boundaries-run-on-spans.story.md:629', 'docs/stories/10.3a.boundaries-run-on-spans.story.md:385-393']
    suggested_owner: dev
  - id: 'DOC-002'
    severity: low
    finding: 'The 10.2 CHANGELOG bullet still says the V3 cut excepts "the first word of a sentence"; 10.3a removed that exception, and both entries are under [Unreleased].'
    suggested_action: 'Add "(removed in 10.3a)" or reword the bullet.'
    refs: ['CHANGELOG.md:35']
    suggested_owner: dev
  - id: 'DOC-003'
