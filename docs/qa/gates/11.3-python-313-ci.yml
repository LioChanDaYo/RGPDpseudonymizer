top_issues:
  - id: 'REL-113-01'
    severity: medium
    finding: 'build-executables run 42125588803 (workflow_dispatch on 8f004e2): build-macos-arm64 cancelled before step 1 (0 steps, 22:55:59Z-22:56:00Z) with the annotation "The configuration ''macos-14-arm64-us-default'' is not supported". The same runs-on: macos-14 (build-executables.yaml l.145, unchanged since 79bd754) built green for Story 11.1 at 15:26Z the same day (run 42054961099). Not caused by this story. AC14 needs three bundles holding PySide6 6.8.3; the macOS one has no reading. The v2.3.0 tag push ran through this workflow (run 41604734608), so the 2.3.1 tag DMG would hit the same runner.'
    suggested_action: 'Orchestrator: re-run the failed macOS job once. If it goes green, compare its normalized WARNING lines with 11.1''s macOS build log (as QA did for Linux). If GitHub refuses the label again, changing runs-on is a workflow change outside this story''s touch list: take it to Lionel. If the runner changes, re-check the DMG''s minimum macOS before "macOS 12 or later" stays in the docs.'
    suggested_owner: po
  - id: 'TEST-113-01'
    severity: low
    finding: 'No test asserts the batch summary card values. test_summary_displays_results runs _show_summary, so it executes the changed _update_card lines, but asserts only the phase and the table row count. The gap predates this story. The new None checks can only turn an AttributeError that never happens (_make_card always builds a QVBoxLayout) into a silent no-op.'
    suggested_action: 'Optional, future: one assertion on the value label text of a card in test_summary_displays_results. Not needed for this story.'
    suggested_owner: dev
  - id: 'DOC-113-01'
    severity: low
    finding: 'The Linux ARM64 wheels of PySide6-Essentials and shiboken6 move from manylinux_2_31_aarch64 (6.7.3) to manylinux_2_39_aarch64 (6.8.3), and the lock lists no sdist, so pip install gdpr-pseudonymizer[gui] no longer resolves on ARM64 Linux with glibc below 2.39 (for example Ubuntu 22.04 ARM, Raspberry Pi OS bookworm). The Lionel-approved CHANGELOG bullet names only the macOS 12 change. No doc claims ARM Linux support, and the AppImage is x86_64. Realistic for very few users.'
    suggested_action: 'Optional, Lionel''s call: half a sentence in the CHANGELOG Qt 6.8 bullet. Otherwise nothing.'
    suggested_owner: po

