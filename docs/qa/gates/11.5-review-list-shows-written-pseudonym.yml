top_issues:
  - id: 'PERF-115-01'
    severity: medium
    finding: 'The immediate update (AC19, D.6) runs on the GUI thread and reads the whole database. One click through the screen''s own handlers (timing2.py, median of 5): at 10,000 saved names, a type change takes 1,031 to 1,038 ms and a custom pseudonym the check accepts takes 1,824 to 1,825 ms; at 2,500 names, 303 to 310 ms and 489 to 512 ms; on an empty database, 44 ms and 75 ms. The window is frozen meanwhile, with no feedback. Cost drivers at 10,000 rows: open_database (PBKDF2) about 35 ms; one find_all() decrypt about 420 ms, run twice by refresh_review_proposals (core/document_processor.py:1471 through _init_processing_context, :1475 its own read, both by B.8) and a third time by custom_pseudonym_refusal (gui/models/validation_state.py:911, since Story 10.11, about 0.5 s of the custom figure); load_library 0.3 ms; load_existing_mappings about 27 ms; GenderDetector.load() 0.3 ms. Realistic scenario: a user whose database holds 10,000 names retypes « Élodie », found as a place in « … Élodie a ensuite appelé M. Lefèvre » (the SM''s shapes.txt), and the window freezes about 1 s; setting a custom pseudonym on « Sophie Bernard » freezes it about 1.8 s. The 0.5 s bar of Task 7.1 is crossed above roughly 2,500 names. Overfitting check: (1) measured on the real handlers with realistic French documents; (2) a type change is a common review action (the SM measured « Élodie » found as a place). The 10,000-row database is synthetic (9,400 people, 550 organisations, 50 places, saved through save_batch). Severity is medium because it is four to seven times PERF-117-01 (low, 273 ms), it hits every type change and custom pseudonym, and it grows linearly with the database.'
    suggested_action: 'Lionel''s call, not fixed here (Task 7.1). Options: accept it (waive), or before the merge reuse _init_processing_context''s rows in the refresh (one decrypt fewer, about 0.4 s at 10,000 rows) and/or run the refresh off the GUI thread.'
    suggested_owner: po
  - id: 'REQ-115-01'
    severity: low
    finding: 'A custom pseudonym set on a titled row shows without its title in the list, while the file keeps the title: « Aurore Bruneau » set on « Mme Élodie Martin » shows « Aurore Bruneau », and the file reads « Mme Aurore Bruneau » (hand115.py, 3 of 3 runs; the only list-to-file differences of 57 rows). It predates this story: get_pseudonym returns the custom pseudonym as stored (gui/models/validation_state.py:1462-1468, unchanged since fe44a7d), and Q-H compares in the stored form on purpose. It sits outside the story''s ACs (AC1 and AC3 concern pseudonyms sent without a custom one; AC9 concerns stored names), but it is the same list-to-file gap AC9 closes for stored names. Nothing is left in clear. Overfitting check: (1) yes, on the real handlers; (2) plausible (titles are common), less frequent than AC9''s case.'
    suggested_action: 'Lionel''s call: leave it, or put it in docs/BACKLOG.md with a pull trigger (show the custom pseudonym with the row''s title, as _with_title does for proposals).'
    suggested_owner: po

