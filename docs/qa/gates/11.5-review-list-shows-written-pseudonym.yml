merge_notes:
  - 'Concurrency (conc115.py). In 20 runs of two documents written at once on one database, with a shared name, a shared first name and a shared place, the first document kept 3 of 3 and the second reported 60 of 60 exactly. In 10 runs with one full pseudonym shown for two different names, the same held. There were 0 invariant breaks: no pseudonym on two names, and one part per real first or last name. In the CLI with a save during the review and on the desktop with a save before the end, the stale names were reported with C1 and C3, and with F1, F3 and F4. The immediate update and the CLI hook returned in 37 ms and 0 ms while another connection held pseudonym_lock, and saved nothing.'
  - 'Lionel''s decisions, driven through the real handlers (hand115.py). A custom pseudonym updates the rows sharing its part at once: « Élodie Dupont » shows « Aurore … », the lone « Élodie » shows « Aurore », « Madame Sophie » shows « Madame Aurore ». A type change updates the row at once. Undoing and redoing everything restored the lists 9 of 9, with the database unopenable (0 opens). The file matches the list except REQ-115-01.'
  - 'Lone forms before their full name (« Martin … Élodie Martin », « M. Lefèvre … Paul Lefèvre ») take the full name''s part with no row of their own: 3 rows saved, nothing reported, CLI and desktop, as B.5 says. A lone name that is its own group keeps its own two-part value (O19).'
  - 'The existing component_matched_in_batch debug line (core/document_processor.py:780, :788; matched_entity=full_name) now also runs during the still-free check and the update. It never reaches a user: every product path configures INFO, and --verbose and logging.level are parsed but never applied. A --verbose process run emitted 16 records, none with a name. It is latent and predates this story; it is not an AC13 breach.'
  - 'This gate file and the story''s QA Results are the expected exception to AC16''s file list (QA''s own outputs).'
  - 'QA started no Codex, Forge, Anvil or Cato process. Codex (Task 7.2) is the orchestrator''s.'
  - 'QA drove the desktop offscreen through the real screens and workers. No human looked at a real window, so the dialog''s layout was not seen.'

