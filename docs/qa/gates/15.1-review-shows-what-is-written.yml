status_reason: 'Round 1 found one defect (CLI-151-01, medium): the command line showed a name added with [A] with a mark naming itself. Round 2: it is fixed tests first and QA re-measured it. On 41e2af7 the four QA cases display the added group with no mark and the found place under an added organisation with the right one; the mark list equals the list the end receives in every command-line run, apart from the end own extra copy of a confirmed [A] place, which written_parts never writes and which changes no other part; QA mutants qadd and the weaker ADDED-only fix are each killed. TEST-151-01 is pinned (fails on the base, kills qcount) and DOC-151-01 reworded. Everything round 1 measured still holds (G2, AC4, the hand check, the hover, the texts). One low note for Lionel: a name added with [A] and then rejected is still written, as before this story (CLI-151-02).'
