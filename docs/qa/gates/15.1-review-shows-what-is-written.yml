top_issues:
  - id: 'CLI-151-02'
    severity: low
    finding: 'Pre-existing, not caused by this story: in the command line, rejecting the group of a name added with [A] does not stop it being written, because the end sends every ADD decision (get_validated_entities, validation/models.py, unchanged since before 15.1). QA probe qa_test_add_mark.py, an organisation « Zorbtech Zorbaville » added over a found place « Zorbaville » and then rejected: the base writes the organisation pseudonym over the whole name, and so does 41e2af7. Story 15.1 makes it visible: the found place group is then displayed « Written instead: the pseudonym of Zorbtech Zorbaville (ORG), unless that group is rejected », whose first line is true (that is what the file gets) and whose condition is not (the group is already rejected and still written). It errs toward replacing: no word is left in clear. The dev test pins today behaviour ([organisation_added_then_rejected]).'
    suggested_action: 'Not blocking. Lionel decides whether rejecting a name added with [A] should take it back out of the file; if so, a story of its own (docs/BACKLOG.md).'
    suggested_owner: po

resolved_issues:
  - id: 'CLI-151-01'
    severity: medium
    raised_on: 9d24e8e
    finding_summary: 'The command line counted a place added with [A] twice in the mark list (its ADDED review and its ADD decision), so the added group was displayed with a mark naming itself (« at 1 of 2 places, the pseudonym of Zorbaville (LOCATION) ») although it is written at every place.'
    resolution: 'Fixed in 41e2af7 (tests first 3273dee): _not_written (validation/workflow.py:720-737) skips a review whose entity is an added place and appends each ADD decision once, whatever the review state. QA round 2: tests first on tree_tf2, 4 xfailed, 0 XPASS, and with --runxfail 4 failed at AssertionError (test_review_rows_written.py:956); the fifth case [organisation_added_then_rejected] came with the fix. On tree_r2 the 5 cases pass. QA qa_test_add_mark.py on tree_r2: the added group displayed with no mark in all four scenarios (a place while on a person, at two places, an organisation over a found place, an organisation added then rejected), the found place marked by the organisation (1 of 1). qa_listcheck on tree_r2 (450 passed): command line 109 equal; 5 differ only by the end own later copy of a confirmed [A] place (the mark list equals the end list with those later copies removed, checked with jq in each); 9 end with pending groups (by design, B.5; one is the round-1 plugin artefact). The extra copy has the same span after its first copy, so written_parts drops it in step 1 and skips it in step 2: no part of any other place changes, and the end writes and saves the place once. Mutants on tree_r2, in memory: qadd (the ADD entries left out) killed by [organisation_added_then_rejected]; QA qadded (the weaker fix, only ADDED reviews left out) killed by [back_to_the_confirmed_group].'
  - id: 'TEST-151-01'
    severity: low
    raised_on: 9d24e8e
    finding_summary: 'The list counters after a decision on a hidden row were fixed but not pinned by a test.'
    resolution: 'Pinned by test_counters_follow_a_decision_on_a_hidden_row (gui/test_review_rows_written_review.py:747). QA: on tree_k2 (the base code with the round test files) it fails at AssertionError, « Reste : 1 » against « Reste : 2 »; on tree_r2 it passes; mutant qcount fails it with the same assert. The approved CHANGELOG still does not name the counter fix (Lionel decides).'
  - id: 'DOC-151-01'
    severity: low
    raised_on: 9d24e8e
    finding_summary: 'AC9 command searched tests/ as a whole.'
    resolution: 'AC9 now reads git grep -n "Story 15.1 tests first" -- tests/unit/ tests/integration/; QA ran it on 41e2af7: nothing (rc 1). Left as a note: the CLI CSV count on the head (23) has the dev probe as its only measure.'

