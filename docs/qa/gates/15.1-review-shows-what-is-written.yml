story_title: 'Every Review Row Matches What Is Written'
scope: 'QA round 1 on head 9d24e8e (branch story/15.1-review-shows-what-is-written, draft PR #135; base origin/main 1bb6f57; tests-first 82334cb, fix cb19601, texts and CHANGELOG 9d24e8e). QA folder: rgpd-analysis/r151/qa (scratch trees tree_base, tree_tf, tree_head, tree_k1 made with git archive of the code, tests/unit, tests/integration and the three dev-corpus folders only; probes, plugins and logs; never committed).'
gate: CONCERNS
status_reason: 'The end, the desktop marks, the hover text and the texts hold everywhere QA measured: G2 identical to the baseline, AC4 reproduced on base and head with 0 rows unmarked and 0 rows wrongly marked, the 33 base rows checked by hand, the desktop mark list equal to the end list in 137 of 137 comparisons, the real hover shown through the real window and Qt own timer. One defect on a real path: in the command line, a name added with [A] under a type reviewed later (for example a place added while reviewing persons) is then displayed with a mark that names itself (« at 1 of 2 places, the pseudonym of Zorbaville (LOCATION) »), although it is written at every place (CLI-151-01, medium). Recommended: fix it, tests first, before merge.'
reviewer: 'Quinn (Test Architect)'
updated: '2026-11-24T08:20:00Z'

top_issues:
  - id: 'CLI-151-01'
    severity: medium
    finding: 'ValidationWorkflow._not_written (validation/workflow.py:719-731) builds its list from every review not rejected, then appends every ADD decision. ValidationSession.add_manual_entity (validation/models.py:577-592) stores an added place both as a review in state ADDED and as an ADD decision, so each place added with [A] is in the mark list twice. The end (get_validated_entities: CONFIRMED and MODIFIED reviews, then the ADD decisions) has it once until the added group is confirmed, and twice after (QA re-run with qa_listcheck: lists equal once confirmed); the end writes and saves it once either way. QA plugin qa_listcheck (list of the mark against the list the end receives, at the moment the end receives it): 16 of 16 command-line runs with an [A] add differ by exactly these duplicates, 93 others equal. The duplicate is never written, so it never changes another group mark (step 1 drops it behind its first copy; step 2 skips it, its kept span already crossed), and the written file is right. It changes the mark of the added group itself, and the review shows that group when its type is reviewed after the add (get_entity_groups is read per type, workflow.py:407). QA probe qa_test_add_mark.py (the real process command, Story 10.15 harness, invented names): a LOCATION added while on a PERSON is displayed with lost 1 of 2 places, by itself (« Written instead: at 1 of 2 places, the pseudonym of Zorbaville (LOCATION), unless that group is rejected »), and the file reads « à Mulhouse »; two places give 2 of 4; an ORG added over a found place gives 1 of 2, by itself (the found place row is marked right). Overfitting Check: met (an ordinary French document, [A] for a missed place or organisation while reviewing persons, process or batch with review). Stopping-rule item 1 (a row marked not written although it is written). No test reads a mark after [A]: QA mutant qadd (the ADD entries left out of the list) survives, 138 passed.'
    suggested_action: 'Tests first: a case that adds a place with [A] while on a person and asserts the added group is displayed with not_written None, and that the end list and the mark list are equal. Then keep one entry per added place in the mark list, whatever the review state (leaving out only the ADDED state is not enough: once the group is confirmed its review and its ADD decision are both sent, and going back to it with [P] would show the mark again); keep pending reviews counted as kept.'
    suggested_owner: dev
  - id: 'TEST-151-01'
    severity: low
    finding: 'Beyond the plan, EntityPanel.update_entity_row no longer returns early for a row not in the list, so the pending counter and the bulk buttons update after a decision on a hidden row. QA measured it (qa_test_counters.py, the real screen, S1): with « Masquer les validées » on, undoing the accept of a hidden row gives « Reste : 1 » with 2 rows pending on the base and « Reste : 2 » on the head. A real fix, but no test pins it: QA mutant qcount (the counters skipped for a row not in the list, the other rows still updated) survives, 136 passed on the story files, test_entity_panel.py, test_validation_screen.py, test_batch_validation.py and Story 11.5 desktop file. The CHANGELOG entry Lionel approved does not mention it.'
    suggested_action: 'With the CLI-151-01 fix: one case that undoes an accept on a hidden row and reads the pending counter. Lionel decides whether the CHANGELOG names it.'
    suggested_owner: dev
  - id: 'DOC-151-01'
    severity: low
    finding: 'AC9 check is git grep over tests/ as a whole, a search the Rules forbid; the dev and QA ran it on tests/unit/ and tests/integration/ (nothing, rc 1). The story Context says the CSV path count of rows written nowhere on the head (23) is measured; it is the dev probe only (sm151h.py), with no independent measure (the PO po2_parts.py covered desktop single, batch and CLI text).'
    suggested_action: 'Whoever touches the story next rewords AC9 to tests/unit/ and tests/integration/.'
    suggested_owner: sm

