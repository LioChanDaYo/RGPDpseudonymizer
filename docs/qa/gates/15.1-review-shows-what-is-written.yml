  - 'AC15, the hover in the real app (qa_test_hover_real.py, offscreen): the real main window with its theme style sheet (viewport at 10,8), the validation screen own editor, the pointer moved with QTest.mouseMove and Qt own tooltip timer, no QHelpEvent sent. S1 single and batch: both blocks (« Lieu : Zorbal », « Personne : Zorbal ») and N3 under the person; S3 over « Zorbaville » inside « Zorbtech Zorbaville »: the organisation and place blocks, N3 under the place naming « Zorbtech Zorbaville » (Organisation); moving to blank space hides it. Control with M22 (override removed): nothing shown. Native Windows platform: QTest.mouseMove does not arm Qt timer, not even for a plain QTextEdit with a document tooltip, so the pointer step there is no reading; a ToolTip event on the native platform shows the right text. Real macOS and Linux desktops not checked (AC11).'
