    severity: high
    finding: 'CLI forms join (validation/models.py _join_forms): with « Zélvine » and « Zelvine » found (LOCATION) in « Brimel Testar valide. Zélvine Testar a signé. Signé : ZELVINE TESTAR. Le contrat avec Zelvine Testar. », [A] « ZÉLVINE » (or [A] « Zélvine », the found name itself) then [E] « Zélvine Testar » on « Zélvine »: the review shows « (3 occurrences, 1 unique) » and writes « … Caen a signé. Signé : Caen. Le contrat avec Caen Testar. »; « Zelvine », another name (Lionel''s Q3), takes the corrected name''s pseudonym and its row is not saved (main keeps it apart). Cause: the grouping puts the [A] place with « Zélvine » by its typed text, so the group''s written texts hold « ZELVINE », of which « Zelvine » is a form; G8''s chain, built by [A]. Fails Task 8''s criterion (a text not written as a form at every place never takes the corrected name''s pseudonym). The desktop is not affected.'
    suggested_action: 'Dev (with the SM): keep [A] places whose written text is of another small-letter class out of the join, or compare each group''s own key texts; a guard of QA''s shape (r1019/qa/probes/test_q19_real.py::test_j_cli_join_through_a_hand_place). Then QA re-checks.'
    refs: ['gdpr_pseudonymizer/validation/models.py', 'rgpd-analysis/r1019/qa/probes/test_q19_real.py']
    suggested_owner: dev
  - id: 'CAPS-001'
