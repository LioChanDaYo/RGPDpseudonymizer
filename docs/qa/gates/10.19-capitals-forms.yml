  - id: 'DEL-1019-01'
    severity: high
    finding: 'delete-mapping by name misses an old damaged row of a capitals form whose accents differ from the typed name''s. QA''s rows, written by v2.2.0 and 43041e9 from documents with accents stored as separate marks: « VORLAN MÈLORA » saved as « VORLAN » + space + lone U+0300 + « LORA »; « MÈLORA ZORBAL », « ZÈLVINE MÈZOR », « À VORLAN MÈLORA » (LOCATION) likewise. delete-mapping « Vorlan Mélora » (or « VORLAN MÉLORA »): the old row stays; with today''s row of the same text saved too, today''s row is erased, one ERASURE entry, and the screen says the pseudonym is now permanently anonymous (exit 0); without it, « not found » (exit 1). Typed as written (« VORLAN MÈLORA ») both go. Under Q3 and AC5 (« HELÈNE » is a form of « Hélène ») the capitals text is a form of the name, and today''s row of it is erased. Cause: the old forms are built from the typed name''s own accents, and the old row''s lone mark comes from the document''s other accent (it survives composition and fold, so the letters filter skips the row). Second shape (QA''s probe, before the Codex review): the name typed without its accents (« Quovome Zorbal », « BELORA MELORA ») erases today''s « QUOVÔME ZORBAL » or « BELORA MÉLORA » but not the old damaged row of the same text (20 of 72 cases). Codex''s second review P0-3.'
    suggested_action: 'Dev with the SM: for a saved row written entirely in capitals with a lone mark, compare it with the name''s old forms with accents and lone marks set aside on both sides (Q3 sets accents aside for capitals only, so a title-case row keeps its marks); keep the sign rule; guards of QA''s shapes (r1019/qa/probes/test_q19_r2b.py::test_c3_old_row_other_accent, test_q19_r2.py::test_p2_old_row_as_today_row), with today''s row saved too and with other people''s rows next to it. Then the SM''s class_delete.py extended to other accents.'
    refs: ['gdpr_pseudonymizer/data/repositories/mapping_repository.py', 'rgpd-analysis/r1019/qa/probes/test_q19_r2b.py', 'rgpd-analysis/r1019/qa/probes/test_q19_r2.py']
    suggested_owner: dev
  - id: 'CAPS-002'
    severity: medium
    finding: 'Desktop batch review: « Signé : ZÉLVINE TESTAR. Zélvine Testar a signé. », rows « ZÉLVINE » and « Zélvine ». Correcting the « ZÉLVINE » row as « ZELVINE TESTAR » (located as the edit dialog does) reaches the « Zélvine » row through Q4 (same letters, other capitals), finds neither the text nor a form of it there, and marks it modified with its old span: « Signé : <p>. <p> Testar a signé. », no row left pending. main keeps the « Zélvine » row pending. Typed « ZÉLVINE TESTAR » it is covered whole. This is CAPS-001''s case on the desktop batch path: G10 covers only a source row without the accent (« ZELVINE »), whose correction does not reach « Zélvine » at all. In single-document review and in the CLI the two places are one variant group (not joined), so both write « <p> Testar » as main does (ruled). Codex''s second review P0-2.'
    suggested_action: 'Dev: apply the CAPS-001 ruling to _action_rows'' Q4 reach: a row reached through the forms rule where neither the correction nor a form of it is found at its place stays pending, as on main and as G10; a guard of this shape in batch.'
    refs: ['gdpr_pseudonymizer/gui/models/validation_state.py', 'rgpd-analysis/r1019/qa/probes/test_q19_r2b.py']
    suggested_owner: dev
  - id: 'CAPS-003'
    severity: medium
    finding: 'Desktop, single document and batch: « Vorlène Quentrix Zorbal a signé. Signé : VORLENE QUENTRIX ZORBAL. », rows « Vorlène » and « VORLENE ». Correcting « Vorlène » to « Vorlène Quentrix » also modifies the « VORLENE » row (« VORLENE QUENTRIX »). A second correction of « Vorlène » to « Vorlène Quentrix Zorbal » no longer reaches it: the every-place check reads its modified span « VORLENE QUENTRIX », not a form of « Vorlène ». The row keeps the first correction and the file reads « <p1> a signé. Signé : <p2> ZORBAL. », silently (both rows modified, none pending). Corrected once to the full name, nothing is in clear. On main the « VORLENE » row is never reached and stays pending. Codex''s second review P0-1.'
