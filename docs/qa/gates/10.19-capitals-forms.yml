    suggested_action: 'Orchestrator: rule whether Q3/Q4 cover the reverse direction (or ask Lionel); then the dev applies it to the correction locating and _action_rows, with a test.'
    refs: ['gdpr_pseudonymizer/validation/models.py', 'gdpr_pseudonymizer/validation/workflow.py', 'gdpr_pseudonymizer/gui/models/validation_state.py']
    suggested_owner: po
