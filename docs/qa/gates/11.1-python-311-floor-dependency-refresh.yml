    ac_gaps: [14]
    notes: 'AC8: text committed in 24bcc0f after Lionel''s yes (orchestrator''s statement); the record of his words in Decisions Recorded is still missing (DOC-111-02). AC14: orchestrator steps, partly after merge.'

