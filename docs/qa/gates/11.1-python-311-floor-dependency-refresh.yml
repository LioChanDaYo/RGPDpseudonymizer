    note: 'defusedxml dropped from the lock with fpdf2 2.8.7, so openpyxl 3.1.5 would parse XLSX files without its entity protection. Now declared optional with openpyxl in excel, formats and all; locked at 0.7.1 with the 30de5f6 hashes; test_defusedxml_with_openpyxl guards the extras.'
  - id: 'DOC-111-03'
    resolved_in: 'd919c79'
    note: 'The CHANGELOG and story claim "only the old fpdf2 used it" is gone; the new texts are true (see evidence.texts).'

evidence:
  tests_reviewed: 10
  risks_identified: 1
  environment: 'As round 1: Windows, the main Poetry venv (Python 3.11.9), cmd.exe /c with no HOME or USERPROFILE override, nothing installed, no repo copy (the tests-first check used the test file, pyproject.toml, mypy.ini, .codecov.yml and every .github/workflows file from git show 08fab97, plus QA''s own two-line pytest.ini; the import tests load the package from the main checkout). Nothing under held_out/, final_exam/ or tests/accuracy/ opened; .gdpr-pseudo.yaml not touched.'
  lock: 'The story''s lock script against 30de5f6 prints exactly 10 lines (the round-1 list without defusedxml). Lock 08fab97 against d919c79: only defusedxml added (0.7.1, optional, markers extra == "excel" or "formats" or "all"), its two files and hashes identical to 30de5f6 (sha256 a352e7e4... wheel, 1bb3032d... sdist); the [extras] table and content-hash changed; no other package differs. poetry check --lock exit 0. 0.7.1 is the latest defusedxml on PyPI.'
  extras: 'pyproject at d919c79: openpyxl appears only in excel, formats and all, and each now lists defusedxml; gui is PySide6-Essentials alone, pdf and docx have no openpyxl. Wheel built to the QA folder (git status unchanged): Requires-Dist defusedxml (>=0.7.1) ; extra == "excel" or extra == "formats" or extra == "all", the same condition as openpyxl. So pip install gdpr-pseudonymizer[excel], [formats] or [all] installs both; [gui] alone installs neither, and Excel input then has no openpyxl at all. The 2.3.0 wheel declared no defusedxml, so 2.3.0 pip users never had it; 2.3.1 adds it for them.'
  installers: 'build-executables.yaml, all three jobs (Windows l.72, macOS l.187, Linux l.323): poetry install --no-interaction --extras "formats gui", then pip install --force-reinstall --no-deps typer==0.9.4. ci.yaml (l.40, 114) and release.yaml (l.45) install the same extras. The frozen app is built with formats and gui, plus the default dev group.'
  runtime: 'In the venv: openpyxl 3.1.5, defusedxml 0.7.1, openpyxl.xml.DEFUSEDXML True (openpyxl/xml/functions.py then takes fromstring and iterparse from defusedxml.ElementTree).'
  local_checks: 'black "335 files would be left unchanged."; ruff check . exit 0; mypy "Success: no issues found in 107 source files"; pytest tests/unit/test_project_config.py "22 passed".'
  tests_first: '08fab97 test file on its own config files: marked "21 passed, 1 xfailed"; --runxfail "1 failed, 21 passed", the AssertionError at line 168, assert ''defusedxml'' in dependencies. CI run 42050301737 (orchestrator''s reading): 1 XFAIL per leg, 0 XPASS, 3318 passed x3, Windows 3168 passed, 3 skipped.'
  new_test: 'test_defusedxml_with_openpyxl checks what its docstring says: defusedxml is a main dependency marked optional, the extras holding openpyxl are exactly all, excel and formats, and each holds defusedxml. A new extra with openpyxl fails it until defusedxml is added there too. It reads pyproject only; the lock is held to pyproject by poetry check --lock in CI and local checks.'
  texts: 'CHANGELOG [Unreleased] Security now says fpdf2 2.9.0 no longer pulls in defusedxml, so 0.7.1 is declared with openpyxl (excel, formats, all), which uses it to block XML entity expansion in Excel files: true. The story''s AC5, Lock check (10 lines, defusedxml stays 0.7.1), the backport paragraph, Environment, Change Log 1.3 and the Debug Log say the same and match the measured state.'
  french: '24bcc0f holds exactly the 14 lines QA read on disk in round 1 (3 + 1 + 6 + 4), unchanged; each mirrors its English line, installation.fr.md l.17 carries the same three facts as installation.md l.17, and it is the only 3.10 line left in the four files.'
  trace:
