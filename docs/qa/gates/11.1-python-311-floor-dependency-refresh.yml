top_issues:
  - id: 'LOCK-111-01'
    severity: low
    finding: 'The raw poetry.lock diff is 384 lines (136 insertions, 248 deletions) against the SM trial''s 425 (177, 248). The trial lock was not kept, so what its 41 extra inserted lines were has no reading. What QA can prove on the committed lock: 120 of the 136 insertions are file-hash lines, and they are exactly the files PyPI publishes today for the 7 moved packages (pillow 83, black 27, the other five 2 each; none missing, none extra); the other 16 are the 7 versions, 3 package python-versions (filelock, fpdf2, pillow), 4 extras lines (fpdf2, pillow, setuptools x2) and the 2 metadata lines (python-versions, content-hash). The 248 deletions are 175 hash lines, 65 other and 8 blank. Every same-version change (9 packages) is a removed python_version < "3.11" dependency line. Realism: none; the lock is complete and the dev''s names and versions match the story exactly.'
    suggested_action: 'None.'
    refs: ['poetry.lock', 'rgpd-analysis/r111/qa/s111/logs/qa_checks.log']
    suggested_owner: po
  - id: 'DOC-111-01'
    severity: low
    finding: 'docs/architecture/14-deployment-architecture.md l.53, 69 and 70 now describe a matrix of 3 OS x 2 Python versions (6 configurations); ci.yaml runs 4 test jobs. The text is the story''s exact text, the file is a design document no user reads to install, and it already disagreed with CI before (9 configurations). Realism: none for a user or the release.'
    suggested_action: 'Backlog note only; align it with docs/ci-cd.md if the architecture docs are ever revised.'
    refs: ['docs/architecture/14-deployment-architecture.md']
    suggested_owner: po
  - id: 'BUNDLE-111-01'
    severity: low
    finding: 'No reading on whether the frozen desktop app built from d919c79 contains defusedxml. The build venv gets it (--extras "formats gui"), and PyInstaller follows openpyxl''s import of it, so it should; in 2.3.0 it came the same way through fpdf2 in the dev group. The one local PyInstaller build on disk (build/gdpr-pseudo-gui, March 2026) predates openpyxl, so it gives no reading. Realism: if it were missing, the Codex P1 would stay open for installer users only.'
    suggested_action: 'Orchestrator: look for defusedxml in the bundles of run 42054961099.'
    refs: ['.github/workflows/build-executables.yaml', 'gdpr-pseudo-gui.spec']
    suggested_owner: po
  - id: 'DOC-111-02'
    severity: low
    finding: 'Decisions Recorded l.124 still holds the placeholder for Lionel''s words on the French docs, although 24bcc0f is committed with his approval; Task 6.1 and 6.2 are unticked.'
    suggested_action: 'Orchestrator: record Lionel''s words and date at l.124 and tick Task 6.'
    refs: ['docs/stories/11.1.python-311-floor-dependency-refresh.story.md']
    suggested_owner: po
  - id: 'QA-111-01'
    severity: info
    finding: 'Round 1 (PASS at b83ef14) missed the Codex P1. QA checked that no repository code imports defusedxml, which is the story''s own claim, but not that an installed dependency (openpyxl) uses it when present. The local venv also kept defusedxml 0.7.1, so no local run could show it.'
    suggested_action: 'For future lock refreshes: for every package that leaves the lock, grep site-packages for imports of it, not only the repository.'
    refs: ['poetry.lock']
    suggested_owner: po

