    severity: medium
    finding: 'Held-out recall drop on run G vs 10.1: Overall FN 64 -> 70, ORG FN 28 -> 34 (R 0.4510 -> 0.3333), LOCATION 15 -> 16, PERSON 21 -> 20. Precision is up (P 0.5353 -> 0.7523, F1 0.6151 -> 0.7236). Lionel''s decision is pending.'
