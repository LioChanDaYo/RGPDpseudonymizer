top_issues:
  - id: 'REQ-001'
    severity: medium
    finding: 'Held-out recall drop in run C 37227245274 vs 37189862679: Overall FN 64 -> 70, ORG FN 28 -> 34 (R 0.4510 -> 0.3333), LOCATION FN 15 -> 16; PERSON FN 21 -> 20. Precision is up (Overall P 0.5353 -> 0.7523). This is the main-gain / held-out-loss pattern of G5. Lionel''s decision is pending (decision 5 was deferred until run C).'
    suggested_action: 'Lionel decides; record date, decision and bounds in Decisions Recorded before merge.'
    refs: ['docs/stories/10.2.overlap-dedup-org-role-filter.story.md:196', 'docs/stories/10.2.overlap-dedup-org-role-filter.story.md:708']
    suggested_owner: po
  - id: 'DOC-001'
    severity: medium
    finding: 'User-facing coverage claims overstate the measured result. CHANGELOG says "no part of a name is left unreplaced" and "the name is still covered by a span of the same type". The PR body says "Every newly missed name is still covered by a same-type span" and "One remaining partial leak". The QA independent coverage check (own script, QA-generated dumps that reproduce both CI runs exactly) finds two exceptions. First, 1 new LOCATION miss ("Lille", interview_04) is covered by another type only. Second, 3 annotations lose name-character coverage vs v2.2: TechSolutions France SAS (board_minutes @42, partial), Pierre (hr_announcement @2778, full) and BRS (sales_proposal @5726, full). The story discloses all of this accurately.'
    suggested_action: 'Reword CHANGELOG lines 18 and 27 and the PR body. Say that 3 main-corpus names lose coverage versus v2.2 (1 partial, 2 that were covered only by accident) and are handed to 10.3, and that 1 new LOCATION miss is covered by another type.'
    refs: ['CHANGELOG.md:18', 'CHANGELOG.md:27', 'PR #81 body (G3 bullet, Remaining work bullet)']
    suggested_owner: dev
  - id: 'PERF-001'
    severity: low
    finding: 'The dedup walk compares each entity with every kept entity, with no active window, so it is O(n^2). The story Technical Constraints asked for an active window. QA probe without logging: 1k entities 0.011 s, 4k 0.134 s, 8k 0.51 s, 16k 2.03 s. This is negligible at realistic sizes and far below NFR1 (30 s).'
    suggested_action: 'Optional: keep kept entities sorted by start and skip those with end_pos <= current.start_pos (active window).'
    refs: ['gdpr_pseudonymizer/nlp/hybrid_detector.py:813', 'docs/stories/10.2.overlap-dedup-org-role-filter.story.md:616']
    suggested_owner: dev
  - id: 'REL-001'
    severity: low
    finding: 'The place phrase is searched in the ORG slice without a word boundary. QA probe: ORG "Vice-président investisseurs est" emits LOCATION "est" at [21,24), which is inside "investisseurs"; the correct offsets are [32,35). This is reachable only with a lower-case region word, but the emitted span has the wrong offsets.'
    suggested_action: 'Anchor the search on token boundaries, or reuse the token offsets from _role_token_spans mapped back to the raw slice. Add a unit test.'
    refs: ['gdpr_pseudonymizer/nlp/hybrid_detector.py:639-641']
    suggested_owner: dev
  - id: 'REQ-002'
    severity: low
    finding: 'Adjacent place phrases with no connector are joined into one LOCATION ("VP Europe Asie" -> "Europe Asie"), because all() over the empty range between them is True. The docstring and the frozen rule text say only de/du/des/d'' join places.'
    suggested_action: 'Require at least one joiner token between phrases, or document the adjacency behaviour in the frozen text.'
    refs: ['gdpr_pseudonymizer/nlp/hybrid_detector.py:145-148', 'gdpr_pseudonymizer/nlp/hybrid_detector.py:124-125', 'docs/stories/10.2.overlap-dedup-org-role-filter.story.md:387']
    suggested_owner: dev
  - id: 'MNT-001'
    severity: low
    finding: 'Stale descriptions of the pre-review behaviour. The HybridDetector class docstring still says "partial overlap prefers spaCy, then the longer core". Dev Notes "Logging" lists the old reasons. "Pseudonym Continuity" item 4 describes "keeps the spaCy one" (Completion Notes acknowledge item 4).'
    suggested_action: 'Update the class docstring to the union and trim rules. The story notes can be refreshed at close-out.'
    refs: ['gdpr_pseudonymizer/nlp/hybrid_detector.py:193-195', 'docs/stories/10.2.overlap-dedup-org-role-filter.story.md:493', 'docs/stories/10.2.overlap-dedup-org-role-filter.story.md:505']
    suggested_owner: dev
  - id: 'DOC-002'
    severity: low
    finding: 'Commit 936f0c5 is labelled docs-only, but it also changes scripts/accuracy_dump_detections.py (the --record-dedup wrapper now takes text). No file under gdpr_pseudonymizer/ or tests/ changes between 1550f54 and 936f0c5, so run C still describes the PR head.'
    suggested_action: 'None needed for metrics. Mention the script fix in the Dev Agent Record for completeness.'
    refs: ['scripts/accuracy_dump_detections.py:63-68']
    suggested_owner: dev
  - id: 'DOC-003'
    severity: low
    finding: 'CI run 37228616068 at 936f0c5 needed one rerun. Attempt 1 failed on macOS with the known mappings.db flake (idx_entities_full_name already exists, tests/integration/test_pdf_docx_processing.py); attempt 2 was green. Tasks 0.2/11.2 require recording the rerun, and it is not yet in the story.'
    suggested_action: 'Add the rerun (run ID, failing tests, attempt 2 green) to the Dev Agent Record.'
    refs: ['docs/stories/10.2.overlap-dedup-org-role-filter.story.md:141']
    suggested_owner: dev
  - id: 'TEST-001'
    severity: low
    finding: 'test_merge_entities_partial_overlap_same_type exercises a containment ("Dubois" inside "Marie Dubois"), not a partial overlap. True partial overlaps are covered in tests/unit/test_hybrid_overlap_role_filter.py.'
    suggested_action: 'Rename it, or add a docstring note.'
    refs: ['tests/unit/test_hybrid_detector.py:299']
    suggested_owner: dev

