  - id: 'V3-001'
    severity: medium
    finding: 'The V3 containment cut drops everything outside the inner name''s clause, including org names that have no detection of their own. QA probe: run-on ORG "Quentrix SA, Zorbalia Conseil, et Vardel Group" with only "Zorbalia Conseil" detected gives "Zorbalia Conseil"; "Quentrix SA" and "Vardel Group" become unreplaced, while run C kept them covered. This plain single-inner case is not one of the two documented known gaps. It occurs 0 times on the main corpus (verified). The CHANGELOG example describes exactly this shape as a benefit; the story''s coverage invariant still lists only the C1/C2 exceptions; and the random invariant test draws PERSON/LOCATION only, so V3 is never exercised by it.'
    suggested_action: 'Either guard the cut (refuse it when the removed part holds an upper-case letter or digit not covered by another kept same-type entity), or have Lionel accept it as a third invariant exception. If accepted, document it in the story invariant and Handoff to 10.3, reword the CHANGELOG example, and extend the random invariant test to ORG.'
    refs: ['gdpr_pseudonymizer/nlp/hybrid_detector.py:820-834', 'CHANGELOG.md:19', 'docs/stories/10.2.overlap-dedup-org-role-filter.story.md:389', 'tests/unit/test_hybrid_overlap_role_filter.py:600']
    suggested_owner: po
  - id: 'REL-002'
    severity: low
    finding: 'The period guard treats abbreviations of 3+ letters ("Corp.", "Inc.", "Cie.") as sentence ends. QA probe: "Zorb Corp. Holding Quentrix" with inner "Holding Quentrix" is cut to "Holding Quentrix", which uncovers "Zorb Corp.". The guard is otherwise correct as specified (short words, all-caps words, titles and digits are skipped).'
    suggested_action: 'Decide in 10.3 whether to treat a capitalised word followed by "." and a capitalised continuation inside one ORG as a non-boundary, or to add generic legal-form abbreviations with a why.'
    refs: ['gdpr_pseudonymizer/nlp/hybrid_detector.py:59-82']
    suggested_owner: dev
  - id: 'DOC-004'
    severity: low
    finding: 'QA report says held-out recall is below baseline by "overall −2 FN, ORG −2 FN". The FN counts rose by 2 (64 -> 66, 28 -> 30), so the minus sign reads backwards. The story words it correctly.'
    suggested_action: 'Write "+2 FN".'
    refs: ['docs/qa/ner-accuracy-report.md:692']
    suggested_owner: dev
  - id: 'TEST-002'
    severity: low
    finding: 'The mappings.db xdist race in tests/integration/test_pdf_docx_processing.py now fails on Linux too. CI 37236257731 at 8e36776: attempt 1 failed on ubuntu 3.10 and 3.11; the single allowed rerun failed again on ubuntu 3.10. All failures are in that file; the other ~1972 tests passed. QA accepts G6 because two later heads with identical code and tests are green 9/9 on their first attempt (690f981 run 37237306349, 99d63b7 run 37239021486), and the story records the sequence.'
    suggested_action: 'Open a tracking issue and fix the test isolation (per-test temporary mappings.db), so that green CI stops depending on reruns.'
    refs: ['tests/integration/test_pdf_docx_processing.py']
    suggested_owner: dev

