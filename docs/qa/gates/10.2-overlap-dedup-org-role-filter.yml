    refs: ['docs/qa/ner-accuracy-report.md (Story 10.2, Held-out set)']
    suggested_owner: po
  - id: 'REL-003'
    severity: low
    finding: 'Pre-existing since run B: rule 1 treats overlapping same-type spans with equal keys as a tie even when their cores sit at different positions, so one is dropped and its extra text is uncovered. Found by QA fuzz. Probe: "Zorbalia et Zorbalia et Zorbalia" with spans [0,20) and [12,32) keeps only [0,20), so the third "Zorbalia" is unreplaced (PERSON and ORG). Pathological repeated text, but it breaks the coverage invariant.'
    suggested_action: 'Apply the key-equal tie only when one core contains the other; otherwise use the union. Add the case to the random invariant test.'
    refs: ['gdpr_pseudonymizer/nlp/hybrid_detector.py (_resolve_same_type_pair_base, rule 1)']
    suggested_owner: dev
  - id: 'REL-004'
    severity: low
    finding: 'By design (Lionel''s rule text excepts sentence-start words): a V3 cut may discard an uncovered capitalised word that starts a sentence. Probe: "Nous avons conclu. Quentrix, Zorbalia Conseil" with a run-on ORG and "Zorbalia Conseil" detected gives "Zorbalia Conseil"; "Quentrix" is unreplaced. Documented residual risk.'
    suggested_action: '10.3: consider dropping the sentence-start exception, or limiting it to common sentence-initial function words.'
    refs: ['docs/stories/10.2.overlap-dedup-org-role-filter.story.md:402']
    suggested_owner: po
  - id: 'PERF-002'
    severity: low
    finding: 'Guard passes grow with the depth of a chain of refused cuts. Adversarial nested chain of run-on ORG spans: n=20 gives 12 passes, 0.025 s; n=80 gives 42 passes, 1.2 s; n=200 gives 102 passes, 19.7 s. The fuzz of realistic shapes needs at most 10 passes, at most 5 ms per case, and the main corpus is unaffected.'
    suggested_action: 'Cap the number of passes, then refuse every remaining V3 cut that discards capitalised words (same safety, bounded time).'
    refs: ['gdpr_pseudonymizer/nlp/hybrid_detector.py (_dedup_same_type_overlaps pass loop)']
    suggested_owner: dev
  - id: 'DOC-005'
    severity: low
    finding: 'The story coverage invariant still lists only C1 and C2 as exceptions, not the guarded V3 cut with its title and sentence-start exceptions. The random invariant test still draws PERSON/LOCATION only; the guard is covered by dedicated tests. The PR body cites pre-rebase SHAs (d2631f2, 28b240f, b918291, ...) no longer on the branch.'
    suggested_action: 'Update the invariant text; add ORG to the random invariant test; map the SHAs in the PR body to their rebased equivalents, or note that they are pre-rebase.'
    refs: ['docs/stories/10.2.overlap-dedup-org-role-filter.story.md:393', 'tests/unit/test_hybrid_overlap_role_filter.py:600', 'PR #81 body']
    suggested_owner: dev
  - id: 'TEST-002'
    severity: low
    finding: 'The mappings.db xdist race in tests/integration/test_pdf_docx_processing.py (carried over) is left for a separate PR, as recorded.'
    suggested_action: 'Separate PR: per-test temporary mappings.db.'
    refs: ['tests/integration/test_pdf_docx_processing.py']
    suggested_owner: dev

