top_issues:
  - id: 'SEC-001'
    severity: low
    finding: 'Failure path only. When a test fails, pytest''s default traceback (--tb=auto) prints the arguments of the test function and of the frame that raised. These are reprs cut to about 240 characters. QA confirmed this with a probe on pytest 9.1.1. So if test_held_out_ranges ever fails, the public CI log, accuracy-output.txt and the JUnit <failure> element would show the start and end of repr(held_out_results): held-out document names and entity text. If the error is raised inside the bootstrap, the raising frame''s arguments would also show (for _summed, one label''s held-out per-document TP/FP/FN lists, in full). Asserting on plain integers (A2.3) closes the assertion-rewriting path but not this one. Nothing is printed while the tests pass, and the 16 lines of both runs hold aggregates only. TestHeldOutMetrics already has the same exposure through its held_out_results argument, so PR A adds almost no new risk.'
    suggested_action: 'Not a merge blocker. Fix this together with the existing follow-up on TestHeldOutMetrics (the len() assert, story Notes for the PO and PM), in one later benchmark PR. Either let the held-out tests get the fixture through request.getfixturevalue(...) and re-raise errors as a bare RuntimeError(<class name>) from None, or run the accuracy pytest with --tb=short or --tb=native (QA probe: neither prints arguments). Design this out of PR B''s TestFinalExamMetrics and its final_exam job before B3.4/B3.5: the planned RuntimeError re-raise does not stop pytest from printing the test function''s fixture arguments.'
    refs:
      - 'tests/accuracy/test_ner_accuracy_validation.py:474-478 (test_held_out_ranges takes held_out_results as an argument)'
      - 'tests/accuracy/bootstrap.py:211-217 (_summed(columns, idx))'
      - 'tests/accuracy/test_ner_accuracy_validation.py:423 (TestHeldOutMetrics, existing, same exposure)'
    suggested_owner: dev
  - id: 'REL-001'
    severity: low
    finding: 'recompute --lines on a file that is not valid UTF-8 raises an uncaught UnicodeDecodeError. The CLI then exits 1 with a traceback, not 2 ("invalid input"), only OSError is caught at scripts/accuracy_paired_delta.py:106-109. The same fault in the JSON input is handled (exit 2), because the JSON reader turns it into a ValueError. CI writes the artifact as UTF-8 (PYTHONUTF8=1), so a real artifact never hits this.'
    suggested_action: 'Catch (OSError, UnicodeDecodeError) at :108, as _load does, and add one unit case. A nit; it can wait for the next PR that touches the script.'
    refs: ['scripts/accuracy_paired_delta.py:106-109']
    suggested_owner: dev

