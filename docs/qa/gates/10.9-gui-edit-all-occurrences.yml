schema: 1
story: '10.9'
story_title: 'Desktop App Edit Applies to Every Occurrence'
scope: 'PR #98 at head a30557b on main e16d15a: tests-first a988f19, fix 828e7b8, CHANGELOG f2f12a1, Dev Agent Record a30557b; rebased epic commit f2f0f4f (docs/prd only); SM/PO story commits.'
gate: CONCERNS
status_reason: 'The fix is the Fix Design as written and it closes the leak: the 9 tests-first failures are proven on every CI leg and locally on their cited lines, everything is green at the head, and every QA probe writes a clean output file, including the dev''s item 4 (the same place sent twice is replaced once; the text is unchanged). Two medium concerns: the editor does not redraw its highlights after an edit, so the CHANGELOG line "the highlights show exactly the places that will be pseudonymized" is false in the running app (UI-001, fix or reword before merge); and the edit dialog re-opens on the detected text, so a second edit can silently undo the first one at every place (UX-001, Lionel decides).'
reviewer: 'Quinn (Test Architect)'
updated: '2026-10-14T12:16:15Z'

waiver: { active: false }

merge_blockers:
  - 'UI-001: either make the editor rebuild its ranges on a state change (one line, plus a screen-level test), or remove the highlight clause from the CHANGELOG entry. Not both needed. Routing: dev, with the PM/SM widening File Locations for the one line.'

decisions_for_lionel:
  - 'UX-001: fold the dialog pre-fill fix into 10.9 (small, same file), or a follow-up story before the release. QA recommends folding it in.'

top_issues:
  - id: 'UI-001'
    severity: medium
    finding: 'The editor''s highlight ranges are not rebuilt after a text edit, a type change or an undo. EntityEditor caches the ranges (_entity_ranges) and rebuilds them only in set_validation_state and refresh_all (add or remove a row); a state change goes ValidationScreen._on_entity_state_changed -> EntityEditor.refresh_entity, which re-applies highlights over the old cache (validation.py:514-518; entity_editor.py:113-119, :192-204, :219). Probe P01/P13 on the real screen, EXT text, row edited through the dialog to "Quentrel Zorbalia Quentrix": the state sends and get_all_entity_ranges returns (0,26),(72,98), but the editor still holds (0,17),(72,89); a click on the second "Quentrix" (pos 90) selects nothing; the add-entity menu is offered there. P12: after a second edit the editor still shows the first detected spans. After refresh_all() the editor matches the state. So AC1''s function-level precision holds (T5), but the CHANGELOG clause "the highlights show exactly the places that will be pseudonymized" is not what the user sees, and Consumer Trace #8 (editor part), #19 (tooltip) and #20 (click lookup) "after the fix" are not delivered; Task 4.1 recorded all 21 rows as holding. Pre-existing refresh gap (same code since v2.0); no leak and no text damage: the output follows the state, not the editor.'
    suggested_action: 'gdpr_pseudonymizer/gui/screens/validation.py:516, in _on_entity_state_changed: replace self._editor.refresh_entity(entity_id) with self._editor.refresh_all() (rebuilds _entity_ranges and _nav_entity_ids from get_all_entity_ranges, then re-applies highlights; cost one pass over the rows per state change). Test first, as a strict xfail on the unfixed code: EXT through start_validation, _show_modify_text_dialog with getText patched -> sorted((s, e) for s, e, _ in screen._editor._entity_ranges) == [(0, 26), (72, 98)] and screen._editor._entity_at_position(90) == row id; after undo_stack.undo() the editor ranges are [(0, 17), (72, 89)]. Check keyboard navigation (Tab) still walks the rows after the change. Alternative if the PM keeps 10.9 narrow: delete "and the highlights show exactly the places that will be pseudonymized" from the CHANGELOG sub-bullet and correct Consumer Trace #8, #19, #20, and file the refresh as a follow-up.'
    refs: ['gdpr_pseudonymizer/gui/screens/validation.py:514-518', 'gdpr_pseudonymizer/gui/widgets/entity_editor.py:113-119', 'gdpr_pseudonymizer/gui/widgets/entity_editor.py:192-204', 'gdpr_pseudonymizer/gui/widgets/entity_editor.py:324-334', 'CHANGELOG.md:152']
    suggested_owner: dev
  - id: 'UX-001'
    severity: medium
    finding: 'Dev deviation (5) is not only cosmetic. The edit dialog is pre-filled with review.entity.text, the detected text, and compares against it (validation.py:576, :578); every other place of the name is re-derived from its detected span on each call (by design, step 4). So a second edit started from what the dialog shows replaces the first edit everywhere. Probe P12 (TITLED: "Dr Quentrel Zorbalia Quentrix ..." twice, "Quentrel Zorbalia" detected at both): edit 1 to "Quentrel Zorbalia Quentrix" covers both places; the dialog re-opens on "Quentrel Zorbalia"; the user adds the title -> "Dr Quentrel Zorbalia"; the written file reads "Dr <pseudonym> Quentrix rejoint le projet. ... Dr <pseudonym> Quentrix." with "Quentrix" back in clear at both places. With UI-001 the editor shows no change either way. P04c: a second edit absent at one place falls back to the detected span there and uncovers what edit 1 covered. Pressing OK on the unchanged pre-fill is a no-op (edit kept). Not a 10.9 regression (the pre-fill is unchanged since Story 6.4), but 10.9 makes the loss reach every place.'
    suggested_action: 'Lionel decides. Recommended fix in _show_modify_text_dialog (validation.py:572-578): current = review.user_modification or review.entity.text; pre-fill with current; apply when ok and text and text != current. The span rule and the state need no change. Test: two dialog edits where the second starts from the pre-fill, assert the pre-fill equals the first edit and no part of the name is left in the written file.'
    refs: ['gdpr_pseudonymizer/gui/screens/validation.py:572-587', 'gdpr_pseudonymizer/gui/models/validation_state.py:406-448']
    suggested_owner: po
  - id: 'GRP-001'
    severity: low
    finding: 'An edit on a detected row does not reach a row added by hand with the same text and type. Probe P05e (THREE: the name at three places, the detector finds two, the user adds the third by hand, then edits the detected row to "Quentrel Zorbalia Quentrix"): the third place keeps "Quentrel Zorbalia", so "Quentrix" stays in clear there and the place gets a second pseudonym in the same document. The other direction works (P05d: editing the hand row reaches the detected row). This follows the group rule as written (the group index is fixed at init and never holds hand rows, as for accept and reject; AC1 precisions define the group as the variant group or the batch (text, type) group), so it is not a fail of 10.9, and it is not a regression (before 10.9 the edit reached no other place). But the CHANGELOG says "every occurrence of that name and type", and once 10.10 makes a hand row a group of one, neither direction will reach the other.'
    suggested_action: 'PM: decide whether an edit or type change on a detected row should also reach hand rows of the same (text, type) (natural home: Story 10.10, which redefines hand-row groups), or reword the CHANGELOG to "every detected occurrence".'
    refs: ['gdpr_pseudonymizer/gui/models/validation_state.py:166-178', 'gdpr_pseudonymizer/gui/models/validation_state.py:197-213']
    suggested_owner: po
  - id: 'DOC-001'
    severity: low
    finding: 'Consumer Trace #17 says 10.8''s stored key and group helper are unchanged; _variant_key changed (the user_modification guard is gone). The change is behaviour-neutral (see deviation ruling 1) and the dev disclosed it in Completion Notes point 1. Task 4.1''s "all 21 rows hold" is also not right for #8, #19 and #20 (UI-001).'
    suggested_action: 'Correct the two rows when the story is next edited.'
    refs: ['docs/stories/10.9.gui-edit-all-occurrences.story.md:381']
    suggested_owner: dev

deviation_rulings:
  d1_variant_key_guard: 'CORRECT. The guard is dead on every path. _variant_key has two callers, expand_validated_entities (validation_state.py:498) and get_all_entity_ranges (:549), and both handle a row with user_modification first and continue (:494-497, :531-547). Batch: the expansion returns before any lookup when there is no variant map (:489-490); batch ranges reach _variant_key only for unedited rows. Rows restored by Précédent/Suivant are rebuilt by set_context -> init_from_detection_result with fresh reviews; in gui/ only _ModifyTextCommand ever sets user_modification (:640, :649), and probe P06 shows the restored rows with user_modification None. Only Consumer Trace #17 is out of date (DOC-001).'
  d2_action_rows: 'CORRECT. Exactly Fix Design step 3''s row list (the row first, then _group_ids without it); text edit and type change share it, so the two cannot drift; private; an unknown id gives [] and falls to the single-command branch, a no-op command as before. It is the seam Story 10.10 changes (coupling below).'
  d3_edited_entity_fallback: 'CORRECT. All three call sites are guarded by "if review.user_modification" (:462, :494 through _validated_rows, :531), so the fallback is unreachable; it satisfies mypy (str | None). An empty edit is falsy and counts as no edit everywhere, before and after. get_validated_entities returns the same list (T8, T9, every existing test unchanged and green).'
  d5_dialog_prefill: 'USER-FACING, for Lionel: see UX-001.'
  d7_epic_story_list: 'NOTED. The rebased epic keeps "Draft" for 10.5 and 10.8 (main''s text). PM commit 8e879d5 (on the local 10.10 branch, not yet on origin) changes both rows to "Done (PR #96, 67807c2)" and "Done (PR #97, e16d15a)"; the later merge resolves it.'

item4_written_output:
  verdict: 'PASS. The text is not damaged.'
  why: '_apply_replacements sorts by (start, longest first) and keeps a span only if it overlaps none already kept (document_processor.py:558-596), so an identical second span is dropped, and a shorter span at the same start loses to the longer one.'
  P05a: 'EXT, hand row added at 72-89 (PERSON, the detected occurrence), then edited through the dialog: both rows MODIFIED; sent [(0,26), (72,98), (72,98)]; written "<p> rejoint le projet. Le contrat est signé avec <p>." with one pseudonym, the text outside the two spans byte-identical, no name part left. One undo reverts both rows (hand ADDED, detected CONFIRMED).'
  P05b: 'same, the detected row edited instead: sent (0,26), (72,98) and the unedited hand row (72,89): written clean.'
  P05c_P05c2: 'hand row at the canonical''s own place 0-17, either row edited: duplicates at 0 and 72, written clean. In P05c2 the unedited hand row expands through the variant map and sends the canonical object, whose span the edit moved in place, as (0, 26) with the text "Quentrel Zorbalia": a text/span mismatch, pre-existing (10.8 lookup), API-only, output clean.'
  P05d: 'hand row at a place the detector missed (125-142), edited: the hand row and the detected row both edited; all three places sent and written clean.'
  reachable_in_the_ui: 'The editor offers "Ajouter comme entité" only for a selection that overlaps no highlighted range (entity_editor.py:361-367, :431-435); every detected place is highlighted, so a hand row exactly on a detected place is reachable only through the API (as in the dev''s probe), or, with UI-001, on an unhighlighted extension such as "Quentrix", which overlaps the sent span and is dropped harmlessly.'

