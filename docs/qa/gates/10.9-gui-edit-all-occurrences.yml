top_issues:
  - id: 'DOC-002'
    severity: low
    finding: 'After step 12, a place where a second edit''s text is absent keeps the span the previous edit gave it, not its detected span. The code docstrings say so (validation_state.py expand_validated_entities and _edited_occurrences), but three texts still say "detected": Consumer Trace #6 and #7 ("each on its edited or detected span"), and the CHANGELOG sub-bullet "Where the edited text is not found at a place, that place keeps its detected span" (CHANGELOG.md:152), which is true for a first edit only. The CHANGELOG sub-bullet at :157 covers the second edit, so a reader is not misled about a leak.'
    suggested_action: 'When the story is next edited: "its edited span or, where the edited text is absent, the span it had before that edit" in #6 and #7; optionally "keeps its current span" in the CHANGELOG. Not a merge condition.'
    refs: ['docs/stories/10.9.gui-edit-all-occurrences.story.md:504-505', 'CHANGELOG.md:152']
    suggested_owner: dev
  - id: 'TEST-FLAKE-001'
    severity: low
    finding: 'Pre-existing, not 10.9: tests/unit/test_final_exam_tooling.py::test_serve_refuses_foreign_host_and_origin (a file 10.9 does not touch) fails intermittently on local Windows with ConnectionAbortedError [WinError 10053] raised in the client''s socket read (socket.py:706, readinto) of a reply from the test''s local server. QA: 15/15 pass run alone; 14/15 under a parallel GUI-suite load (one failure, same error as the dev saw); passed inside QA''s full -n 4 run; green on every CI leg. The test builds a synthetic workspace in tmp_path; QA opened no exam material.'
    suggested_action: 'Backlog: in the test''s _call helper (test_final_exam_tooling.py:912-925), treat ConnectionAbortedError/ConnectionResetError on a refused request as the refusal, or have the server read the request body before answering 403, so Windows does not abort the read.'
    refs: ['tests/unit/test_final_exam_tooling.py:912-925', 'tests/unit/test_final_exam_tooling.py:1157-1168']
    suggested_owner: po

handed_off:
  # Known and accepted, not 10.9 failures (Lionel, relayed by the orchestrator, 2026-10-14).
  - id: 'GRP-001'
    owner: 'Story 10.10'
    note: 'An edit on a detected row does not reach a hand row of the same text and type (probe P05e, unchanged at 56b600e: "Quentrix" in clear at the hand-added place, second pseudonym). 10.10 decides the hand-row rule (its AC3 makes a hand row a group of one, then neither direction reaches the other).'
  - id: 'GROUP-ACCEPT-REJECTED'
    owner: 'Story 10.10'
    note: 'A group accept still reaches a row rejected on its own (probe K01: after a group accept and a lone reject of the Saint-Zorbal row, a second group accept sets all three rows back to confirmed). Lionel put this, with the "decided on its own" memory (a group reject skips rows accepted on their own; accept after a mistaken group reject brings the group back; accept_all_known skips rejected rows), in Story 10.10. 10.10 also refines 10.9''s "skip any rejected row" into "skip rows rejected on their own": after it, a correction will again reach rows rejected only by a group reject (today probe A05 shows them skipped).'
  - id: 'PRE-001'
    owner: 'Story 10.10'
    note: 'Batch Précédent then Valider still writes the waiting document with the earlier document''s positions (probe P06b at 56b600e: "<p>le projet. Le contrat est signé avec Quentrel <p>").'
  - id: 'COSMETIC'
    owner: 'documented residuals'
    note: 'The panel and the tooltip show the detected text after an edit (Consumer Trace #12, #19); where a second edit adds a title present at one place only, the pseudonym carries "Dr" at every place (probe R03, nothing in clear); in batch the "modified" count counts every row of the group (#21).'

