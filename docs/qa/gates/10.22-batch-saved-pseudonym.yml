top_issues:
  - id: 'LOCK-1022-01'
    severity: low
    finding: 'Behind a running 40-document batch on a copy of a 30,000-row database: delete-mapping failed 8 of 22 times (exit 2, « database is locked … Please report this issue if it persists. »; database unchanged); import-mappings ended 9 of 20 times with exit 0 and a red « Errors: N » (those rows not imported; a rerun imports them). 0be4073: 0 of 80. At 10,000 rows: 0 of 43 failed, waits about twice as long (median delete 5.0 s against 2.6 s). Cause: a document now holds the lock for its reload too, while these commands keep SQLite''s 5 s wait. Realism: needs tens of thousands of saved names and an erasure or import on that database while a batch runs; plausible for a shared institutional database, uncommon; the failure is visible and safe.'
    suggested_action: 'A release-note line, or the same 300 s wait for delete-mapping and import-mappings in a follow-up. Consumer Trace row 9''s « nothing is changed » holds for delete, not for import (partial).'
    refs: ['gdpr_pseudonymizer/data/database.py', 'gdpr_pseudonymizer/cli/commands/delete_mapping.py', 'gdpr_pseudonymizer/cli/commands/import_mappings.py', 'rgpd-analysis/r1022/qa/probes/writers_probe.py', 'rgpd-analysis/r1022/qa/logs/writers30k_head.log']
    suggested_owner: po
  - id: 'PERF-1022-01'
    severity: low
    finding: '40-document batch, median of 4 runs: 86.2 s against 70.9 s at 30,000 saved rows (+22 %); 65.8 against 65.7 s at 10,000 rows; 38.9 against 42.3 s on a new database (no measurable cost). The reload decrypts every saved row inside the lock (about 1.5 s per document at 30,000 rows, QA''s estimate from the SM''s 0.52 s at 10,000). Every batch on such a database pays it; outputs are correct.'
    suggested_action: 'Follow-up: reload only the rows saved since the context was loaded.'
    refs: ['gdpr_pseudonymizer/core/document_processor.py', 'rgpd-analysis/r1022/qa/logs/stress_s2big30k_*.log']
    suggested_owner: dev
  - id: 'AC11-1022'
    severity: low
    finding: 'The tests-first commit 4b02542 never ran on CI (the PR was opened after the fix), so AC11''s "on every leg" is not met as written. QA''s local G2 (Windows) stands in: --runxfail 12 failed at the marked lines, 3 passed, no PRE; marked 3 passed, 12 xfailed, three times in one process and three with -n 4.'
    suggested_action: 'Accept the local G2, or record the gap; nothing to change in the code.'
    refs: ['https://github.com/LioChanDaYo/RGPDpseudonymizer/pull/113']
    suggested_owner: po
  - id: 'TEST-1022-01'
    severity: low
    finding: 'Survivors: m10 (no commit before BEGIN IMMEDIATE), m11 (no commit at the end of the block), m13 (no rollback on an error), equivalent or defensive today; m5 (no lock in finalize_document_tabular, no product caller), as the story says. .xlsx is in no committed test (QA''s test_e3 fails on 0be4073, passes on the head).'
    suggested_action: 'Optional guards in a follow-up.'
    refs: ['tests/unit/test_parallel_saved_pseudonym.py', 'rgpd-analysis/r1022/qa/mut']
    suggested_owner: dev
  - id: 'OBS-1022-01'
    severity: info
    finding: 'A timed-out wait shows the database library''s raw text (« OperationalError: (sqlite3.OperationalError) database is locked [SQL: BEGIN IMMEDIATE] … »); 0be4073 showed a longer raw text. Reachable only if another program holds the lock 300 s. A desktop batch cancel takes effect when the wait ends (seconds in practice). The audit entry waits 300 s (busy_timeout 300000 against 5000), as Fix Design 1 says.'
    suggested_action: 'None.'
    refs: ['rgpd-analysis/r1022/qa/probes/desktop_probe.py']
    suggested_owner: po
  - id: 'OBS-1022-02'
    severity: info
    finding: 'The CHANGELOG names two people under one pseudonym with neutral_id; on 0be4073 places and organisations also shared one with the default theme (« Tourcoing », the dev''s « Amiens », QA''s test_e1 « Lyon » and « Société Générale Technologies »). The fix covers them.'
    suggested_action: 'The PM may say "two names".'
    refs: ['CHANGELOG.md']
    suggested_owner: po

