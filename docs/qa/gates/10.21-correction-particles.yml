top_issues:
  - id: 'DOC-1021-01'
    severity: low
    finding: 'The CHANGELOG says two people whose two-word names differ only by an accent "now share one pseudonym". That holds where an add or a correction reaches the other writing. When the detector finds both writings whole (« Zélvine Vorlanne » and « Zelvine Vorlanne ») and the user accepts them as found, the CLI now shows one entity "applied to 2 total occurrences" but writes two pseudonyms, as 10.19 already does for capitals forms (« Zélvine »/« ZELVINE »: two pseudonyms on main too). Realism: plausible (a document that writes a name once without its accents); the effect is one person under two pseudonyms, nothing in clear; the same on main.'
    suggested_action: 'Word the entry for a name you add or correct, or leave it; pseudonym identity across joined forms is a PO question for later, not this story.'
    refs: ['CHANGELOG.md', 'rgpd-analysis/r1021/qa/probes/test_qa1021_examples.py (IDa, IDb, IDc1, IDd, Ex2det)']
    suggested_owner: po
  - id: 'REQ-1021-01'
    severity: low
    finding: 'G7''s one-word reading in _same_or_form keys on a leading French preposition (FRENCH_PREPOSITION_PATTERN: de, du, des, à, en, au, aux, d'', l'') whatever the type, not only on a place name: delete-mapping « de Vorlanne » does not erase a saved PERSON « de Vorlânne » (probe G7q), where Lionel''s rule would. Realism: unlikely; it needs a surname saved alone with its particle, in two accent spellings. The confirmation lists what is erased; the same on main.'
    suggested_action: 'Follow-up only if it shows up: read the one-word exception for LOCATION rows.'
    refs: ['gdpr_pseudonymizer/data/repositories/mapping_repository.py:37-56']
    suggested_owner: dev
  - id: 'TEST-1021-01'
    severity: low
    finding: 'Two mutants survive the committed tests: M09 (a place name of two words saved with its preposition, « à Saint Zorbaville », read as one word, so « à Saint Zòrbaville » would stay) and M14 (the variant search through 10.20''s narrower _query_by_full_name; near-equivalent, every row it misses is reached by the name''s own search). The six changed 10.19 cases keep names that now say the opposite (test_unreached_place_goes_back_to_review, test_batch_unreached_row_stays_pending, the two ..._never_takes_another_name, test_widening_never_over_a_word_in_small_letters); their docstrings say why.'
    suggested_action: 'Optional: a guard for a two-word place name with its preposition (QA''s probe G7c); rename the six when the files are next touched.'
    refs: ['rgpd-analysis/r1021/qa/mut/M09_g7_two_words', 'rgpd-analysis/r1021/qa/mut/M14_p9_no_old_rows', 'tests/unit/test_cli_capitals_forms.py', 'tests/unit/gui/test_capitals_correction_desktop.py']
    suggested_owner: dev
  - id: 'OBS-1021-01'
    severity: info
    finding: 'P9 reaches the old rows of each variant that has a row saved today. A variant saved only by v2.2.0 (its damaged row alone) is not a variant the delete can see: with « Vorlan Mélora » saved and a v2.2.0-only row of « Vorlan Mèlora », delete-mapping « Vorlan Melora » erases the first and its old row and keeps the second (probe P9c); with only a v2.2.0 row, typed without the accent, the CLI says "No entity found" (P9d), as on main. Realism: contrived (two accent spellings of one name across versions); P9d is visible to the user.'
    suggested_action: 'None in this story.'
    refs: ['rgpd-analysis/r1021/qa/probes/test_qa1021_examples.py (P9c, P9d)']
    suggested_owner: po

