top_issues:
  - id: 'DOC-117-01'
    severity: medium
    finding: 'C18 singular differs from the approved text. Approved (stopb-11.7-texts-final.md and Dev Notes "Exact texts"): "Note: 1 saved pseudonym holds a word of its own name. See ''gdpr-pseudo validate-mappings --own-words''." Head: notice_line(1) builds "Note: 1 saved pseudonym holds a word of their own name. ..." (gdpr_pseudonymizer/core/saved_own_words.py:535-539, the shared tail " a word of their own name." is the plural''s). T18''s C18_ONE (tests/unit/test_stored_pseudonym_own_word.py:1027-1030) holds the same wrong string, which is why T18 and CI pass. Realistic: a database with exactly one row found prints it after every process and batch; in the SM''s 22 databases, 5 have exactly one (common_3, common_4, mix_2, mixb_1, mixb_8). Every other C, D and CL1 text matches byte for byte (QA tools/texts.py), the French help texts too.'
    suggested_action: 'Dev: the singular says "its own name" in notice_line and in T18''s C18_ONE (one word each). Not reworded by QA (brief: report text mismatches). Then QA re-gates.'
    suggested_owner: dev
  - id: 'REQ-117-01'
    severity: low
    finding: 'The find rule in code goes further than the story text, and the code is the right one. The story ("The rule (find)", Fix design 1, the SM''s find117_main.py) takes the first run of the pseudonym found in the name, then applies the places-and-organisations filter to it. own_word(pseudonym, name, keep) (custom_pseudonym.py:536) moves on to the next run when the filter refuses one. When an organisation''s pseudonym shares a common word before a city, the story''s reading drops a real leak that Lionel''s rule reports (a library place shared). QA probe on the head (qa_repro.py): « Chambre de Commerce et d''Industrie Grand Lille » saved as « Commerce International Lille »: first run « Commerce », story reading not reported, product reports « Lille »; « Marseille Innovation » saved as « Innovation Marseille SAS »: product « Marseille », story reading nothing; « Groupe Hospitalier Est Lyon » saved as « Groupe Commercial Lyon »: product « Lyon », story reading nothing. The product only adds rows that meet Lionel''s criterion; on the 22 databases both readings give the same 100 and 7 rows. No test pins this case (T1''s org_place_word shares only the place).'
    suggested_action: 'SM: align "The rule (find)" and Fix design 1 with the code ("a refused run does not stop the search; the next run is compared"). Optional, dev: one T1 case with an organisation that shares a common word and a library place.'
    suggested_owner: sm
  - id: 'PERF-117-01'
    severity: low
    finding: 'The desktop builds the replacement plan on the window''s thread when « Remplacer la sélection » is clicked (_replace_selected, gui/screens/database.py:773, plan_replacement, which runs the whole check again). QA timing on real-shaped rows (qa_plan_cost.py): 273 ms at 10,000 rows, 549 ms at 20,000. Fix design 7 asks for exactly this, and AC3 governs the report (the "list" worker computes own_words in its thread, as required), so this is not an AC3 failure. The window freezes for a quarter to half a second on one click on a large database.'
    suggested_action: 'Later, dev: plan from the worker''s own_words, or build the plan in a DatabaseWorker operation.'
    suggested_owner: dev
  - id: 'REL-117-01'
    severity: low
    finding: 'Wrong message on one stop. When the ticked rows are no longer found under the lock (the screen was listed, then another program, for example gdpr-pseudo replace-pseudonym --all, replaced them), replace_own_word_rows returns stop_reason "not_found", and _on_replace_complete (gui/screens/database.py:867, through _show_replace_stop :847) shows D15 « Aucun nouveau pseudonyme libre n''a été trouvé... » instead of D14 « La base de données a changé depuis l''affichage... ». Nothing is written; only the message misleads. Needs two programs on one database at once (the realism of O6, accepted as rare but real).'
    suggested_action: 'Later, dev: map "not_found" from the worker to D14 (database changed). No new text needed.'
    suggested_owner: dev
  - id: 'TEST-117-01'
    severity: low
    finding: 'The notice is tested on process (T17, T21), the parallel batch (T20) and the desktop single document (G6), not on the sequential command line batch, the desktop BatchWorker count or the two tabular write paths. All go through DocumentProcessor._own_word_count by construction. QA probe on the sequential batch (--workers 1, two documents, T4''s rows): the note printed once with the count 3.'
    suggested_action: 'Optional, dev: one sequential batch case and one BatchWorker case.'
    suggested_owner: dev

