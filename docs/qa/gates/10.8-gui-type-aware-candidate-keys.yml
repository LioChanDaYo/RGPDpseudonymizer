top_issues:
  - id: 'TEST-001'
    severity: low
    finding: 'Four existing test fixtures still build preview maps with the old "{text}_{start}" string key: tests/unit/gui/test_validation_state_grouping.py:57, tests/unit/gui/test_detection_worker.py:67 (a mocked return value), tests/unit/gui/test_processing_screen.py:135 and tests/integration/gui/conftest.py:102. The story left them unchanged on purpose (AC5: no assertion reads them, and they pass). After 10.8 these keys never match, so those fixtures silently give their rows no preview, and mypy does not check tests, so nothing flags it.'
    suggested_action: 'In a later housekeeping commit, build them with candidate_key(...) so a future test that reads a preview from these fixtures does not get an empty one by surprise.'
    refs: ['tests/unit/gui/test_validation_state_grouping.py:57', 'tests/unit/gui/test_detection_worker.py:67', 'tests/unit/gui/test_processing_screen.py:135', 'tests/integration/gui/conftest.py:102']
    suggested_owner: dev
  - id: 'MNT-001'
    severity: low
    finding: 'The batch path hands the preview map to ValidationScreen.set_context through **kwargs read as dict[str, Any] (gui/screens/validation.py:341, :363), so mypy cannot see the key type there. Today the only writer is build_pseudonym_previews (batch.py:896), which is typed, so the AC1 claim "mypy flags any stale reader or writer" holds for every real call site (QA mutation check below), but not for a future writer that builds the map by hand and passes it through set_context.'
    suggested_action: 'Information; no change needed for 10.8.'
    refs: ['gdpr_pseudonymizer/gui/screens/validation.py:341', 'gdpr_pseudonymizer/gui/screens/validation.py:363']
    suggested_owner: dev

pre_existing_findings:
  # Found during QA probe 7.3. None is caused or made worse by 10.8; all are identical
  # on the unfixed code (2a9a19a, product tree identical to 51d8429) and the code involved
  # is unchanged since v2.2.0 (git diff v2.2.0 51d8429 on batch.py, validation.py and
  # batch_worker.py is empty). Not merge blockers for 10.8 (story Task 7.3: "A finding
  # outside that is reported, not a fail"). Routing is Lionel's call.
  - id: 'PRE-001'
    severity: high
    finding: 'Batch validation, "Précédent" then "Valider et continuer": the list of the document shown (the previous one) is sent as the result of the document the batch is waiting on. That document is then written with the previous document''s positions: its own names stay in clear (partly or fully) and its text is damaged. Probe with the real BatchWorker thread, only detection replaced: doc 1 "Quentrel Zorbalia rejoint le projet. Le contrat est signé avec Quentrel Zorbalia." came out as "<org pseudonym>orbalia rej<org pseudonym>ojet. Le contrat est signé avec Quentrel Zorbalia."; the batch summary still says the document was processed. Same on both trees. Since Story 6.7.3 (v2.0.0), whose AC says re-submitting a previous document "replaces the stored result but does not re-trigger the worker"; the code stores it under the current index (batch.py:928) and wakes the worker with it (batch.py:950). The button is visible and enabled on the previous document (validation.py:319).'
    suggested_action: 'Lionel: own story before the next release (recommended), or later. Smallest safe fix: on a previous document, disable "Valider et continuer" or make it store the result for the shown document without calling submit_validation_result; add a test that drives Précédent then the button.'
    refs: ['gdpr_pseudonymizer/gui/screens/batch.py:928', 'gdpr_pseudonymizer/gui/screens/batch.py:950', 'gdpr_pseudonymizer/gui/screens/validation.py:695-713', 'gdpr_pseudonymizer/gui/screens/validation.py:777-786', 'gdpr_pseudonymizer/gui/screens/validation.py:319', 'docs/stories/6.7.3.batch-validation-workflow.story.md:43']
    suggested_owner: po
  - id: 'PRE-002'
    severity: medium
    finding: 'Batch validation, "Précédent" then "Suivant": the current document is rebuilt from its detections, so every accept and reject already made on it is lost (rows back to "to review", except names already in the mapping database). "Valider et continuer" sends only confirmed rows and gives no warning about rows still to review, so if the user does not review again, those names stay in clear. Probe (real worker): two confirmed rows were pending again after Suivant; validating then wrote doc 1 unchanged, both names in clear. Visible on screen (the rows show as to review), same on both trees.'
    suggested_action: 'With PRE-001: keep the current document''s review state across Précédent/Suivant, or warn before validating with rows still to review.'
    refs: ['gdpr_pseudonymizer/gui/screens/validation.py:715-733', 'gdpr_pseudonymizer/gui/screens/batch.py:900-914', 'gdpr_pseudonymizer/gui/models/validation_state.py:327-358']
    suggested_owner: po
  - id: 'PRE-003'
    severity: medium
    finding: 'The dev''s out-of-scope finding, confirmed. A row added by hand whose text and type match a detected group of more than one row: "Rejeter" on the added row (right-click menu, or Delete in navigation mode) rejects the detected rows of that group instead; the added row stays "added" and is replaced, the detected places are not replaced and stay in clear. "Accepter" on it confirms the detected rows (harmless). The panel shows the detected rows turning rejected; undo restores them. Batch path (one row per occurrence): happens for any name detected at least twice in the document. Probe: ORG "Zorbaville" detected at 0 and 21 and accepted, ORG "Zorbaville" added at 33, reject the added row: rows 0 and 21 REJECTED, sent [ORG 33], two "Zorbaville" left in clear; identical on both trees. 10.8 narrows it, never widens it: with a pair present, at 51d8429 the reject also reached the LOCATION row (two left in clear), at 10ddd62 only the ORG rows (one left in clear); in single-document validation it happened at 51d8429 when the text had two types, and cannot happen at 10ddd62 (each (text, type) group has one row there). Present in v2.2.0 (text-only group).'
    suggested_action: 'Lionel: where it goes (a small story, or Story 10.9, which works on the same function). Likely fix: a row without a stored key acts on itself only (validation_state.py:164-176), plus a test.'
    refs: ['gdpr_pseudonymizer/gui/models/validation_state.py:132-176', 'gdpr_pseudonymizer/gui/widgets/entity_editor.py:384-386', 'gdpr_pseudonymizer/gui/widgets/entity_editor.py:474-475', 'gdpr_pseudonymizer/gui/widgets/entity_editor.py:553-558']
    suggested_owner: po
  - id: 'PRE-004'
    severity: low
    finding: 'Not a leak. A custom pseudonym set in the desktop app ("Changer le pseudonyme") is shown in the list but never reaches finalization: expand_validated_entities and get_validated_entities return entities without it, and the output uses the generated pseudonym. Probe E: "Quentrix Zorbal" absent from the output on both trees.'
    suggested_action: 'PM: check the intent and file a backlog item if it should apply.'
    refs: ['gdpr_pseudonymizer/gui/models/validation_state.py:416-423', 'gdpr_pseudonymizer/gui/screens/validation.py:828-843']
    suggested_owner: po

