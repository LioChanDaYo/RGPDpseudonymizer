  - id: 'TEST-118-01'
    severity: low
    finding: 'The field-read counter sees work done on entities only. The class assertion catches entities rebuilt as plain DetectedEntity objects, and a zero count fails at large / small (ZeroDivisionError). A future rewrite that copies offsets into plain numbers or tuples and then scans those would read no entity field during the scan, so the count would not see it. The historical bugs (P1 full scan, P4 old join) are caught exactly: 61.49 and 64.10 / 63.88 against cap 16.'
    suggested_action: 'No change now. If the dedup walk or the join is rewritten to scan projected values, count that scan as well (or add a slowed copy of the new shape) in the same story.'
    suggested_owner: dev
  - id: 'PERF-118-01'
    severity: low
    finding: 'The timed margins are proven on Windows only: quiet, with one busy process per CPU, and with two per CPU. A macOS runner has not been measured. The flake rate it removes (16 first-attempt macOS failures in 292 runs) cannot be shown by one green CI run.'
    suggested_action: 'If one of the five ids fails on CI again, the AssertionError line now carries (ratio, small, large): take that number to Lionel, with a pull trigger rather than a watch.'
    suggested_owner: po

