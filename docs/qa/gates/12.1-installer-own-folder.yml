nfr_validation:
  security:
    status: PASS
    notes: 'This is the point of the story. Install and uninstall remove only the installer''s own items. The only recursive removal targets $INSTDIR\_internal, and $INSTDIR always ends in \GDPR Pseudonymizer when SecMain runs (T3, SecMain alone). Nothing is written to or deleted from the old folder (T5 path events). No new input beyond the HKLM InstallDir value the installer itself writes.'
  performance:
    status: PASS
    notes: 'A few string operations at init, on the page and in SecMain; no new file scan.'
  reliability:
    status: PASS
    notes: 'A silent install never waits: the old-copy box has /SD IDOK, and the 2.3.2 prompt keeps /SD IDCANCEL. An aborted install never shows the message (it is the last statement of SecMain). A default or Browse install is upgraded in place.'
  maintainability:
    status: PASS
    notes: '_Nsis fails on any unknown command or name, so a script change forces a test update. Through Poetry, black --check . reports 352 files unchanged, ruff exits with rc 0 and mypy finds no issues in 109 source files. The PR lint and quality checks pass.'

