story: '12.1'
story_title: 'The Windows Installer Uses Its Own Folder and the Uninstaller Removes Only Its Own Files'
scope: 'Review of head d1644d8 (PR #131, draft; base 9dafd44). Tests first 1098c9e, fix f4c36eb, CHANGELOG and KL-012 d1644d8. QA folder: rgpd-analysis/r121/qa (scripts and logs, never committed).'
gate: PASS
status_reason: 'Every AC that can be checked before merge is met, and the NSIS behaviour the fix relies on is confirmed in the NSIS source. The tests fail on the base at an assert and pass on the head; all 24 of the dev''s mutants and 17 of QA''s 20 are caught. The three findings are low: one outcome-neutral difference between the test interpreter and NSIS, one uncaught mutant that a real install cannot tell apart, and one wording nuance in KL-012.'
reviewer: 'Quinn (Test Architect)'
updated: '2026-11-19T09:09:00Z'

top_issues:
  - id: 'TEST-121-01'
    severity: low
    finding: '_Nsis._strcpy treats a negative start offset beyond the start of the string as 0 and returns the whole string. Real NSIS leaves the variable empty: exec.c EW_ASSIGNVAR, l.668-669 (`if (start<0) start=srclen+start; if (start>=0) {...}`), kichik/nsis a96303e. The story''s Test Plan states the same wrong rule ("counts from the start"). The outcome is the same for installer.nsi: a string shorter than 19 characters is never equal to the 19-character `\GDPR Pseudonymizer`, so OwnFolderOf appends the subfolder either way. TrimFolder on an empty string gives "" in both.'
    suggested_action: 'When the file is next touched: return "" in _strcpy for that case, and correct the Test Plan sentence. No change needed for this merge.'
    suggested_owner: dev
  - id: 'TEST-121-02'
    severity: low
    finding: 'QA mutant Q3 survives: if the message is gated on gdpr-pseudo.exe instead of gdpr-pseudonymizer.exe, no test fails. Lionel''s answer to question 2 names gdpr-pseudonymizer.exe, and no T5 case has one executable without the other. Every release installs both, so a real install would behave the same.'
    suggested_action: 'Optional: add a T5 case whose old folder holds only gdpr-pseudo.exe (expect no message).'
    suggested_owner: dev
  - id: 'DOC-121-01'
    severity: low
    finding: 'KL-012 says the old uninstaller "matters only for a folder typed by hand". Strictly, the v2.0.0 to v2.3.2 uninstaller (`RMDir /r "$INSTDIR"`, `RMDir /r "$SMPROGRAMS\${APPNAME}"`; identical in every tag) also deletes a file the user saved inside a default or Browse « GDPR Pseudonymizer » folder. For practical purposes it is true: the default folder is under Program Files (x86), which needs admin rights to write to, and the app writes nothing there. The text is Lionel''s, word for word (question 3).'
    suggested_action: 'Report only. Any change to the KL-012 text needs Lionel''s approval.'
    suggested_owner: po

