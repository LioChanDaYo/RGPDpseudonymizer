merge_notes:
  - 'NSIS (item 1), checked against the NSIS source (kichik/nsis master a96303e; QA copy in r121/qa/nsis-src): on Next, Ui.c runs the page''s leave callback (l.537) and then NotifyCurWnd(WM_NOTIFY_INIGO_MONTOYA) (l.549). DirProc then reads the folder field back into $INSTDIR: GetUIText(IDC_DIR,dir) and validate_filename(dir) (l.975-977). The field write in OwnFolderLeave is therefore needed. It uses the same handles as MUI2 Directory.nsh (FindWindow "#32770" "" $HWNDPARENT, GetDlgItem 1019, l.106/109), and the leave define comes right before MUI_PAGE_DIRECTORY (installer.nsi l.52-53; Directory.nsh l.122-124).'
  - 'NSIS order before .onInit: the /D= folder is copied raw (Main.c l.275-278). The registry folder is read only when that folder is not valid, and gets a trailing backslash (Ui.c l.309-349). InstallDir is the fallback (l.353-355). Only then does .onInit run (l.396). So ReadRegStr (installer.nsi l.128) runs before WriteRegStr, which is at the end of SecMain (l.239), on the same key and value as InstallDirRegKey. TrimFolder is what keeps the default folder, with its trailing backslash, in place.'
  - 'TrimFolder and OwnFolderOf: the loop stops on an empty string. They compare the last 19 characters, with an explicit maxlen and offset (exec.c l.666-677), case-insensitively. Every register they use is pushed and popped (T1 and T12 sentinels). /SD IDOK: in silent mode my_MessageBox returns the default without showing the box (util.c l.140-141), and MB_OK has no jump. The uninstaller uses RMDir without /r on the install folder and the Start Menu folder. The only RMDir /r in the script is "$INSTDIR\_internal" (T10).'
  - 'Browse: Ui.c l.1054-1063 appends « GDPR Pseudonymizer » unless the chosen folder''s name already equals it (lstrcmpi). A Browse folder therefore always ends in it and is upgraded in place, as is the default folder. In every released installer (v2.0.0 to v2.3.1 byte-identical on these lines; v2.3.2 adds only `RMDir /r "$INSTDIR\_internal"`), APPNAME, INSTALLDIR, InstallDirRegKey, the InstallDir WriteRegStr and the three CreateShortCut lines are unchanged. Every release builds with PyInstaller 6 (6.19/6.21) and no contents_directory, so all 25 downloads hold the four items the new uninstaller removes. v1.1.0 had no installer.'
  - 'The model (item 2): T12''s order (leave, then read-back trimmed) and the start state (raw /D=; the registry folder with a trailing backslash; then InstallDir; a drive root ignored) match the source. Model differences: TEST-121-01 (StrCpy). The read-back trims only trailing backslashes and spaces, while validate_filename also strips *?|<>/": and control characters (no case uses them). Registry values with quotes or .exe and other invalid /D= paths are not modelled. FileOpen on a file in use is not in _Nsis; the old _run covers it. $(MSG_OLD_COPY) is not expanded; the 0-warning compile and AC9 step 3 are the proof. The RMDir error flag and RMDir /r''s refusal of an invalid path are not modelled. File /r copies a fixed list; AC12 pins the real one. None of these changes an outcome for installer.nsi.'
  - '2.3.2 checks (item 3): the five existing tests and their helpers are byte-identical to 9dafd44 (ast comparison) and pass. On a typed-folder upgrade, the app-open check looks at the new subfolder, not the old copy. That is harmless: nothing in the old folder is touched.'
  - 'CHANGELOG CL1 and KL-012 (item 4) are byte-equal to the story texts. F1 is byte-equal to b983ab3 in both languages. CL1 is true as written. KL-012: see DOC-121-01.'
  - 'AC11 (item 5): git diff --name-only 9dafd44...HEAD adds docs/prd/epic-12-windows-installer-own-folder.md and docs/prd/epic-list.md to File Locations. Both come from the PM commit d6735f5, which is on this branch and not on origin/main. git diff --name-only d6735f5...HEAD lists exactly File Locations plus this story. Accepted.'
  - 'Story Status still reads Approved, not Review (a review-story prerequisite). Status belongs to the story owner; QA did not change it.'
  - 'This gate file and the story''s QA Results are QA''s own outputs, the expected exception to AC11''s file list. QA started no Codex, Forge, Anvil or Cato process. Codex (Task 6.3) is the orchestrator''s, now that QA gives a PASS. Lionel''s hand check (AC9) remains before the release.'

