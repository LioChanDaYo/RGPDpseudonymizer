top_issues:
  - id: 'REQ-141-01'
    severity: low
    finding: 'Lionel accepted the wrong persons because a user "rejects them in the review" (Q5, Q6, G3, the CHANGELOG: "you reject it in the review"). The CLI batch with workers, the desktop batch without review and the desktop processing worker call process_document(skip_validation=True): there is no review, so every such word is written as a person pseudonym. QA paths143.py, CSV and XLSX through process_document: a colour column « Rose », « Ambre », « Marine » and a month « Avril » become person names (« Rose » -> « Judith Leal »); « Pierre de taille pour la façade. » becomes « Cyprien Loureiro de taille pour la façade. ». QA written143.py: audit_summary.txt holds « Azure » 7 times in the file written with the rule off and 0 times with it on (each replaced by a person name). Never a leak, and today 110 PERSON false positives are already written the same way in batch. The same paths gain: a lone first name in a « Prénom » column (« Nadia », « Sarah », « Véronique ») and « Bernard » in a « Nom » column were in clear with the rule off and are replaced with it on.'
    suggested_action: 'Not blocking. Lionel decides whether the "reject it in the review" wording (CHANGELOG, PR text) should also say that batch runs without review write these words as names. If he wants a different behaviour on no-review paths, a story of its own (docs/BACKLOG.md).'
    suggested_owner: po
  - id: 'PERF-141-01'
    severity: low
    finding: 'The rule checks every listed word against every person already found (a list scan, hybrid_detector.py _lone_first_names), so its own time grows with the square of the number of names. QA perf143.py, real model, Windows: a 10,158-word document made of 13 dev documents, detection 5.41 s without the rule, 5.57 s with it, the rule alone 86 ms. Lists of « - <first name> » lines: 1,000 lines 23 ms, 3,000 lines 208 ms, 10,000 lines 2.17 s (detection 9.60 s -> 12.87 s, which also holds the merge of 3,292 more persons).'
    suggested_action: 'Future: keep the persons sorted and look them up with bisect, as written_parts does. Only a document holding thousands of lone first names sees it.'
    suggested_owner: dev
  - id: 'DOC-141-01'
    severity: low
    finding: 'G3: the question Lionel answered (stopA-answers.md, 2026-11-26) shows the PERSON numbers and "places and organisations unchanged", not the [Overall] line (P 0.8068 -> 0.8001, R 0.8465 -> 0.8474; NFR9 false-positive rate 19.32% -> 19.99%, against a target below 15% that was already missed). AC6 asks for every drop with the numbers in front of him. The [Overall] drop is exactly the same 20 wrong persons (overall FP 449 -> 469 = PERSON FP 110 -> 130), so nothing new is hidden; the G3 record in the story lists the [Overall] line as the orchestrator read it.'
    suggested_action: 'Show the [Overall] line in the final PR text Lionel approves.'
    suggested_owner: po
  - id: 'DOC-141-02'
    severity: low
    finding: 'Story text against what shipped: AC12 git diff --name-only also lists the PM epic files (docs/prd/epic-14-first-names-short-text.md, docs/prd/epic-list.md), which File Locations does not name (the Branch section does: the PM commit abf5885). AC8 command greps tests/ as a whole, which the isolation rule forbids; QA ran it on tests/unit and tests/integration. Tasks 2 and 3 went into one commit on the orchestrator word, so the commit subjects differ from the Tasks wording (Debug Log, Task 2).'
    suggested_action: 'None needed for the merge; for the next story, scope the AC greps to tests/unit and tests/integration.'
    suggested_owner: sm

