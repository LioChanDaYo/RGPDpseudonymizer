scope: 'PR #108. Re-check (Task 7.6, v1.5) at head 47b788c on main ff678fc (10.12, 10.13, 10.15 and 10.18 merged), after the read-only Codex review of 30ab70b (CHANGES REQUESTED) and the orchestrator''s ruling (r1014/codex/ruling.md). v1.5 commits: story e5d7314, tests first bc4d767, fix 8fbc0be, Dev Agent Record 47b788c; the v1.4 commits rebased unchanged (27f8d52, fb024e9, af912d6, c4b24fe, 2963c0c, 5f47b5d, 2e8eb16, 6fa4e2d, e9e6bd7). The first review (2026-10-19) was at 59b0fa1; its evidence is kept below recheck_v15, which supersedes it where v1.5 changed the behaviour.'
