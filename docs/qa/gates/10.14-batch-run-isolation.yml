    prior_probes: 'Re-run as Task 7.3 says, adapted copies in r1014/qa/prior/ (texts reworded to main-corpus words; windows answered; French restored with switch_language). At 59b0fa1, 13 passed: QA f1 in both orders (Open Folder and the hidden "Démarrer" both refused, B started with _launch_worker, B''s output "Le contrat est signé avec <P>.", A''s worker ends, rows = Vorlan Mestrix only); QA f4 x5 (control, edit and undo, generated and custom: full pseudonym, no "Quentrix", rows PERSON, editor/panel/undo shortcut disabled, the direct emit ignored); the PO''s R1 to R4 (one message, same worker still waiting, one worker, phase 1, nothing processed, « Revenir au lot » to doc 0''s kept review; after R4 « Annuler le lot » stops the worker), C1 unchanged (doc 0''s output deleted, its row kept), the English labels ("Cancel batch" on both screens, "Batch in progress", "Back to the batch"). At 3084c9b, 12 failed, 1 passed (C1): R1 batch screen reset to phase 0, R2/R3 the processing screen, R4 the worker dropped; f4 writes "<pseudonym> Quentrix a signé le contrat.", "Xantor Vellion Quentrix a signé le contrat." and ORG rows.'
