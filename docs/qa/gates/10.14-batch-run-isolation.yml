status_reason: 'v1.5 holds on real output. A launch reached while a run is live (the route AC1 missed) is now refused like every route: the approved message once, nothing cancelled, no second worker, the run goes on and keeps every file it wrote, the log line carries the run id only; the N2 race and the stale review are gone, and a new run starts normally after the summary. A refused several-files drop stays refused when the batch ends while the real modal message is open (three variants, the real window), and the next drop with no batch shows its toast as before. G2 holds for the four new expected failures (T4 x2, T13, T15 at the dev''s lines; T14 and T16 x2 pass); the fix commit only removes their markers. The committed tests catch all nine mutants of the new code. The rebase is clean (11 commits identical, the CHANGELOG commit replayed with the same 6 lines after 10.18''s bullet). CI green on every leg of the three v1.5 runs; local full suite 2794 passed, 10 skipped. The v1.4 review holds. Low items only: the three regression-protection gaps of the first review stay backlog; FALLBACK-001 is resolved.'
