top_issues:
  - id: 'TEST-001'
    severity: low
    finding: 'No committed test pins the handler guards behind the disabled controls (Fix Design AC5: _handle_entity_action, _handle_add_entity, _handle_bulk_action, _on_undo, _on_redo return while a document is written). QA mutants Q14 (no _finalizing check in _handle_entity_action) and Q15 (none in _on_undo) pass all 41 new tests. The file stays right either way (the AC4 copies), but the review then no longer matches what was written: under Q14 a queued context-menu edit or reject changes the row during writing; under Q15 the undo shortcut''s own signal undoes it. QA probes test_qa5[screen_edit_emit, screen_reject_all] (Q14) and test_qa5[screen_undo_shortcut] (Q15) catch them.'
    v15_note: 'Unchanged at 47b788c: Q14 and Q15 rebuilt on the head pass the 46 tests; QA probes test_qa5[screen_*] still catch them.'
    suggested_action: 'Backlog (BMAD dev agent): one T8 case that emits editor.entity_action_requested and _undo_shortcut.activated while the worker is held and asserts the review''s undo index is unchanged.'
    refs: ['gdpr_pseudonymizer/gui/screens/validation.py:581-584', 'gdpr_pseudonymizer/gui/screens/validation.py:838-850', 'tests/unit/gui/test_finalization_handoff.py']
    suggested_owner: dev
  - id: 'TEST-002'
    severity: low
    finding: 'AC precision AC1 says File › "Fichiers récents" is refused before the recent-files list is touched. The code does it (main_window.py:397-398), but T1[recent_menu] uses a one-entry list, so re-saving it changes nothing visible. QA mutant Q9 (the refusal removed from _open_recent; the home screen''s own refusal still shows the message) passes all 41 tests, yet moves the opened file to the top of the list and re-saves the settings before refusing. QA probe test_qa1b (two entries, the second opened) catches it.'
    v15_note: 'Unchanged at 47b788c: Q9 rebuilt on the head passes the 46 tests; QA probe test_qa1b still catches it. The new _open_refused flag does not touch this path (the menu''s own refusal comes before _notify_file_selected).'
    suggested_action: 'Backlog: T1[recent_menu] with two recent entries, opening the second, asserting the list order is unchanged.'
    refs: ['gdpr_pseudonymizer/gui/main_window.py:391-399', 'tests/unit/gui/test_batch_run_isolation.py:550-554']
    suggested_owner: dev
  - id: 'TEST-003'
    severity: low
    finding: 'The run filter on the worker''s progress signal is not pinned. QA mutant Q2 (no _is_stale check in _on_progress) passes all 41 tests: T5 emits an old run''s progress but records neither the progress bar nor the document table. Under Q2, run A''s late "DOC_DONE" marks both of run B''s documents "Traité" and sets the bar to 100 while B''s first document is still being detected (display only, no file or row affected). QA probe test_qa4c catches it.'
    v15_note: 'Still not pinned at 47b788c (Q2 rebuilt on the head passes the 46 tests; QA probe test_qa4c still catches it). Since v1.5 its effect is unreachable: a new run can start only after the old run''s summary, and the old worker''s finished is its last signal, so no old progress can arrive after a new run starts. The four run filters are now defence in depth.'
    suggested_action: 'Backlog: add the progress bar value and the document table''s status column to T5''s record.'
    refs: ['gdpr_pseudonymizer/gui/screens/batch.py:829-836', 'tests/unit/gui/test_batch_run_isolation.py:847-880']
    suggested_owner: dev

