    qa1_routes: 'Ten routes x French and English (Ctrl+O, Ctrl+Shift+O, recent menu, home batch button, drop file, drop folder, drop two files, drop-zone click, home recent row, "Démarrer"), a two-document batch waiting on doc 0, Escape: exactly one window, the approved texts with one button and no cancel, parented to the main window; same screen, no chooser, no start_processing, one worker, the same worker still waiting on doc 0, phase 1, same files, recent list unchanged, no toast, the same review object; then both files written with every name replaced and the rows exactly the batch''s three names.'
    qa2_back: '« Revenir au lot » (the real button) from: the waiting review itself (same review object, its accept and undo index kept), the home batch button, the database screen (Ctrl+Shift+O), the doc-0 review reached by "◀ Précédent" while doc 1 waits (back to doc 1''s kept review with its reject and undo index), the progress screen through a folder drop (batch screen, phase 1, same worker), "Démarrer". "◀ Retour" is hidden on every batch review. Files and rows as validated.'
    qa3_moments: 'A batch without per-document validation: the message, « Revenir au lot » shows the progress screen as it is. A paused batch: the message from the database screen; the batch screen comes back still paused ("Reprendre"). Escape from the database screen: the database screen stays, the review and the worker untouched. Ctrl+O after « Annuler le lot » is confirmed but before the worker ends: still refused; after the summary, Ctrl+O opens the chooser and the document. The home batch button after the summary: a fresh batch screen (phase 0, no files, no worker).'
    qa4_codex1: 'Run A held in detection; the user''s ways to start B (Ctrl+Shift+O, then "Démarrer") are both refused, one worker. Run B started with _launch_worker; both orders: the review shown is B''s text, only B''s worker gets a list, B''s file is TEXT_B with B''s two names replaced and nothing of A, A''s worker ends, A writes nothing, the rows are B''s two names. Stale review: A''s review on screen after B started, its validate clicked: nothing submitted. The new log lines name no entity (the batch logger recorded; batch_previous_run_cancelled and batch_stale_signal_ignored carry ids only). The fallback and N2: FALLBACK-001.'
    qa5_codex4: 'Single document, generated and custom pseudonym, eight late changes made while the worker is held before it reads its input: a state edit to "Zorbal" (0-6), a retype to ORG, undo of everything back to the detected ORG, the context-menu edit signal, the undo shortcut''s signal, Ctrl+Shift+R plus a reject action, a bulk reject, an added entity. Each time: the 8 controls and "Finaliser" and "◀ Retour" are disabled; the screen routes change nothing in the review; the file is "<P> a signé le contrat." with P the stored pseudonym ("Xantor Vellion" when custom); the one row is ("Zorbal Quentrix", "PERSON", P). Batch: the kept review edited, retyped and given another custom pseudonym while doc 0 is held: no submitted entity is a review object, the file and the row hold the confirmed name and pseudonym.'
