gate: CONCERNS
status_reason: 'Pre-merge review at 8046e53 (code 6207bcf). G2 verified: runs B 37586332744 and C 37586903397 and the baseline 37534939934 match every line and number in the story, QA report, CHANGELOG and PR body. G3 strict passes per slice (FN 452/44/54/354), G5 recall unchanged (held-out FP 47 -> 45), level 2 = 0, level 2b = 0, no TP lost, CI 9/9 on attempt 1, NFR1 on the same CPU. One medium concern for Lionel: wiring W-JOIN to the frozen particle list (decision 14) lets it join a line-end name to a next line that starts with Le/La/De/Du/Des (over-coverage only, 0 fires on the corpus).'
reviewer: 'Quinn (Test Architect)'
updated: '2026-10-07T15:00:00Z'

waiver: { active: false }

merge_blockers:
  - 'WJ-001 needs a decision from Lionel: accept the article-led W-JOIN joins as a residual (as with "Zorbalia\nDirectrice de"), or narrow the next-line side. No name is left in clear either way.'

top_issues:
  - id: 'WJ-001'
    severity: medium
    finding: 'Because W-JOIN reads the capitalised resource particles (R-WJP, decision 14), it now joins a one-word PERSON at the end of a prose line to a next line that starts with a capitalised French article or preposition in the list (Le, La, De, Du, Des) followed by a capitalised word and a lower-case word. QA probes (base 23df76a: no join in each): "remis à Zorbalia\nLe Comité a validé" -> PERSON "Zorbalia\nLe Comité"; likewise "Zorbalia\nLa Direction", "Zorbalia\nDes Zorbs", "Zorbalia\nDu Quentrix". Over-coverage only, 0 fires on the main corpus, but W-JOIN is widened beyond particle + surname to common sentence and heading starts. The only R-WJP negative test is the blank line.'
    suggested_action: 'Lionel decides: keep one list but exclude Le, La, De, Du, Des on the next-line side of the break, or accept the residual explicitly. Either way add a negative test with an invented name.'
    refs: ['gdpr_pseudonymizer/nlp/hybrid_detector.py:156-170', 'tests/unit/test_hybrid_particles_location_noise.py:454']
    suggested_owner: po
  - id: 'REQ-001'
    severity: low
    finding: 'Particle extension takes a capitalised role word as the surname after a lower-case article particle: "pour Zorbalia le Directeur a signé" -> "Zorbalia le Directeur"; "avec Zorbalia la Présidente du jury" -> "Zorbalia la Présidente". This goes against P6. 0 cases on the main corpus.'
    suggested_action: 'Reject a surname token that is a role word (or a stoplist word).'
    refs: ['gdpr_pseudonymizer/nlp/hybrid_detector.py:868-928']
    suggested_owner: dev
  - id: 'REQ-002'
    severity: low
    finding: 'The Q12 dictionary check compares the surname token and the whole chain, not the place inside the chain. Without a LOCATION detection blocking it, "Zorbalia de La Rochelle", "de Le Mans" and "du Havre" are extended, although "La Rochelle", "Le Mans" and "Le Havre" are dictionary entries. spaCy usually tags these LOC, which blocks the extension.'
    suggested_action: 'Also look up each chain suffix that starts at a capitalised particle, plus the du/au -> Le contraction.'
    refs: ['gdpr_pseudonymizer/nlp/hybrid_detector.py:920-924']
    suggested_owner: dev
  - id: 'PERF-001'
    severity: low
    finding: 'tail_parts.search scans the whole last line of a PERSON span and is quadratic in the number of particles inside it: 2k particles 0.14 s, 8k 2.4 s, 32k 38 s. Such spans are unrealistic. Entity-count scaling is linear (32k entities 0.22 s).'
    suggested_action: 'Search only the last few tokens of the span; at most 3 particles matter (_MAX_PARTICLES).'
    refs: ['gdpr_pseudonymizer/nlp/hybrid_detector.py:148', 'gdpr_pseudonymizer/nlp/hybrid_detector.py:885']
    suggested_owner: dev
  - id: 'COV-001'
    severity: low
    finding: 'The ", <role>" trim is unguarded, unlike " - <role>". In "Zorbalia Quentrel, Directeur de Zorbtech", "Zorbtech" leaves the PERSON span and is left in clear if it has no detection of its own. There is no ", Role" span on the main corpus, and this is within the decision-9 sign-off.'
    suggested_action: 'Apply the dash guard to the comma variant.'
    refs: ['gdpr_pseudonymizer/nlp/hybrid_detector.py:949-958']
    suggested_owner: po
  - id: 'MX-001'
    severity: low
    finding: 'A trimmed or extended PERSON can become an exact text match of an ORG/LOCATION detection, which the type-blind exact match drops. QA fuzz (3,000 cases, detect level, base vs new): 4 PERSON covers moved to an ORG cover (0 any-type losses); 1 result depended on input order (base 0).'
    suggested_action: 'None here; story 10.3c (type-aware exact match) removes it.'
    refs: ['gdpr_pseudonymizer/nlp/hybrid_detector.py (_is_exact_match, 10.3c)']
    suggested_owner: dev
  - id: 'DOC-001'
    severity: low
    finding: 'Decision 5 says the 16 extra stoplist words must not appear anywhere. The story still names "NA", "PJ" and "NON CONFORME" in Entry categories and in Held-Out Isolation, and "NON CONFORME" again in the 1.3 Change Log row. They are absent from code, resources and tests (verified). Nit: the QA report and PR body say an all-caps surname is accepted "only after a capitalised particle"; it is also accepted after an all-caps particle.'
    suggested_action: 'Replace them with "the draft stoplist extras (not approved, decision 5)".'
    refs: ['docs/stories/10.3b.particles-roles-location-noise.story.md:621', 'docs/stories/10.3b.particles-roles-location-noise.story.md:674', 'docs/stories/10.3b.particles-roles-location-noise.story.md:842']
    suggested_owner: sm

