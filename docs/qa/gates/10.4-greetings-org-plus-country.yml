top_issues:
  - id: 'REQ-001'
    severity: low
    finding: 'Salutation shape 2 needs , . or ! directly after the name, or the end of the line. French typography puts a space (often U+202F) before "!", so "Merci Zorbalia !" is not detected, and neither is "Bonjour Zorbalia et Quentrel," (QA probes). This is the frozen rule text, not a regression; the name stays as before 10.4, found only if spaCy finds it.'
    suggested_action: 'Lionel''s call: allow horizontal whitespace before ! (and ?), and "et" between two names, in a follow-up (Epic 9), or now through Task 2 and a new G1 run. After 10.4 no detector change happens inside Epic 10.'
    refs: ['gdpr_pseudonymizer/nlp/hybrid_detector.py:217-221 (_OPENER_TWO_NAMES_RE, _OPENER_ONE_NAME_RE)']
    suggested_owner: po
  - id: 'REQ-002'
    severity: low
    finding: 'R-OPC''s "never merges a role token" means a role known to the 10.2 role lists (match_org_role). When spaCy types a spelled-out French role as ORG ("Directeur"), it merges with a following place: "Directeur France" becomes ORG "Directeur France", and LOCATION "France" is kept. Without R-OPC it would be ORG "Directeur" plus LOCATION "France". An ORG false positive gets wider; no cover is lost; 0 main-corpus cases.'
    suggested_action: 'Optional, later: skip the merge when the ORG piece starts with a French role word (a resource list), or accept it as an extra candidate.'
    refs: ['gdpr_pseudonymizer/nlp/hybrid_detector.py:2167-2234 (_merge_org_places; role test at :2202)']
    suggested_owner: po
  - id: 'TEST-001'
    severity: low
    finding: 'Two frozen conditions have no test that fails without them. (1) R-SAL-SPLIT requires a comma after the second name: a mutant that drops the check survives the 108 tests. (2) R-DEF-NAME rejects an alias that starts with an article: the only test uses lower-case "la", which the alias pattern already rejects, so a mutant without the check survives. QA probes show both behave as frozen ("Merci Zorbalia, Quentrel." stays one PERSON; « La Zorbtech » is not taken).'
    suggested_action: 'Add two unit tests: two names after an opener followed by "." (not split), and a capitalised-article alias (not taken).'
    refs: ['gdpr_pseudonymizer/nlp/hybrid_detector.py:1580', 'gdpr_pseudonymizer/nlp/hybrid_detector.py:292', 'tests/unit/test_hybrid_greetings_org_country.py']
    suggested_owner: dev
  - id: 'DOC-001'
    severity: low
    finding: 'The 10.4 CHANGELOG continuity note says keys still have no entity type, but unlike the story''s Pseudonym Continuity section ("Story 10.7 will change that") and the 10.3c entry, it does not point to Story 10.7. The 10.4 rules add new keys (organisation + place, short forms, aliases), so the pointer is useful.'
    suggested_action: 'Add one line to the 10.4 continuity note: "Making the lookup type-aware is Story 10.7".'
    refs: ['CHANGELOG.md (10.4 entry, "Upgrading: pseudonym continuity")']
    suggested_owner: dev

