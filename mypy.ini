[mypy]
# 3.11 is the project's minimum supported version (pyproject `python`, and the
# black/ruff py311 targets; Story 11.1). Keep python_version equal to the floor:
# this file overrides [tool.mypy] in pyproject.toml.
python_version = 3.11
strict = True
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_any_unimported = False
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
check_untyped_defs = True
strict_equality = True

# Third-party libraries without type stubs
[mypy-spacy.*]
ignore_missing_imports = True

[mypy-stanza.*]
ignore_missing_imports = True

[mypy-pytest.*]
ignore_missing_imports = True

[mypy-sqlalchemy]
ignore_missing_imports = True

[mypy-sqlalchemy.*]
ignore_missing_imports = True

[mypy-structlog]
ignore_missing_imports = True

[mypy-structlog.*]
ignore_missing_imports = True

[mypy-yaml]
ignore_missing_imports = True

[mypy-yaml.*]
ignore_missing_imports = True

[mypy-PySide6]
ignore_missing_imports = True

[mypy-PySide6.*]
ignore_missing_imports = True

