# ORG role filter (Story 10.2, AC3). An ORG detection whose whole normalized
# text is a role is dropped. Every entry needs a `why` that holds for any
# French business text. Never add an entry because it appeared as an FP in
# the corpus alone; never add held-out strings (Story 10.2 Dev Notes).
# Frozen list: Story 10.2 Task 2.2. Changes go back through the story.

acronyms:            # case-sensitive, whole span
  - {term: "CEO", why: "Chief Executive Officer: English C-suite title used in French companies"}
  - {term: "CTO", why: "Chief Technology Officer: English C-suite title"}
  - {term: "CFO", why: "Chief Financial Officer: English C-suite title"}
  - {term: "COO", why: "Chief Operating Officer: English C-suite title"}
