# Regex Pattern Library for French Entity Detection
# Letter classes cover Latin-1 + Latin Extended-A (í ñ ø å ş ı ł č š ž ő...),
# not only French accents, so non-French names are not cut mid-word.
# Each pattern category can be enabled/disabled for hybrid detection
# Story 10.3a: name tokens are joined by horizontal whitespace only
# ([ \t\u00A0\u202F]), never by a line break: a name does not span lines.

patterns:
  # High confidence patterns: Titles + Names
  titles:
    enabled: true
    confidence: 0.85
    entity_type: PERSON
    patterns:
      - pattern: '\b(M\.|Mme|Mlle|Dr\.|Pr\.|Maître|Me\.?)[ \t\u00A0\u202F]+([A-ZÀ-ÖØ-ÞĀ-ſ][a-zß-öø-ÿĀ-ſ]+(?:-[A-ZÀ-ÖØ-ÞĀ-ſ][a-zß-öø-ÿĀ-ſ]+)*(?:[ \t\u00A0\u202F]+[A-ZÀ-ÖØ-ÞĀ-ſ][a-zß-öø-ÿĀ-ſ]+(?:-[A-ZÀ-ÖØ-ÞĀ-ſ][a-zß-öø-ÿĀ-ſ]+)*)?)'
        description: "Matches titles + names: M. Dupont, Dr. Marie Dubois, Mme Laurent, Maître Dupont, Me Mercier, Dr. Marja-Liisa Mikkola"
        examples:
          - "M. Dupont"
          - "Mme Laurent"
          - "Dr. Marie Dubois"
          - "Pr. François Martin"
          - "Maître Dupont"
          - "Me Mercier"
          - "Me. Dubois"

  # High confidence patterns: Compound hyphenated names
  compound_names:
    enabled: true
    confidence: 0.80
    entity_type: PERSON
    patterns:
      - pattern: '\b([A-ZÀ-ÖØ-ÞĀ-ſ][a-zß-öø-ÿĀ-ſ]+-[A-ZÀ-ÖØ-ÞĀ-ſ][a-zß-öø-ÿĀ-ſ]+)\b'
        description: "Matches hyphenated first names: Jean-Pierre, Marie-Claire"
        examples:
          - "Jean-Pierre"
          - "Marie-Claire"
          - "Anne-Sophie"
          - "Jean-François"

  # High confidence patterns: Last, First name order
  last_first_names:
    enabled: true
    confidence: 0.80
    entity_type: PERSON
    # First name (after the comma) must be in the name dictionary, otherwise
    # any "Word, Word" pair matches ("Merci, Jean", "Weber, Directeur")
    require_known_first_name: true
    patterns:
      - pattern: '\b([A-ZÀ-ÖØ-ÞĀ-ſ][a-zß-öø-ÿĀ-ſ]+(?:-[A-ZÀ-ÖØ-ÞĀ-ſ][a-zß-öø-ÿĀ-ſ]+)?)[ \t\u00A0\u202F]*,[ \t\u00A0\u202F]*(?!Cabinet|Société|Association|Fondation|Institut|Groupe|Consortium|Fédération|Entreprise|Compagnie|Direction|Service|Département|Commission|Comité|Syndicat|Chambre|Mutuelle|Coopérative|Ordre|Caisse|Union|Confédération|Agence|Ligue)([A-ZÀ-ÖØ-ÞĀ-ſ][a-zß-öø-ÿĀ-ſ]+(?:-[A-ZÀ-ÖØ-ÞĀ-ſ][a-zß-öø-ÿĀ-ſ]+)?)'
        description: "Last, First format (e.g., Dubois, Jean-Marc) with exclusion of ORG/function words"
        examples:
          - "Dubois, Jean-Marc"
          - "Martin, Sophie"
          - "Lefèvre, Marie-Claire"

  # Medium confidence patterns: Location indicators
  location_indicators:
    enabled: true
    confidence: 0.65
    entity_type: LOCATION
    patterns:
      - pattern: '\b(à|en|dans|près de|ville de)[ \t\u00A0\u202F]+([A-ZÀ-ÖØ-ÞĀ-ſ][a-zß-öø-ÿĀ-ſ]+(?:[ \t\u00A0\u202F]+[A-ZÀ-ÖØ-ÞĀ-ſ][a-zß-öø-ÿĀ-ſ]+)?)'
        description: "Matches location indicators: à Paris, en France, près de Lyon"
        examples:
          - "à Paris"
          - "en France"
          - "près de Lyon"
          - "ville de Marseille"
          - "dans Toulouse"

  # Medium confidence patterns: Organization suffixes
  organizations:
    enabled: true
    confidence: 0.70
    entity_type: ORG
    patterns:
      - pattern: '\b([A-ZÀ-ÖØ-ÞĀ-ſ](?:[A-ZÀ-ÖØ-ÞĀ-ſa-zß-öø-ÿĀ-ſ0-9]|[&''’.\-](?=[A-ZÀ-ÖØ-ÞĀ-ſa-zß-öø-ÿĀ-ſ0-9]))*(?:[ \t\u00A0\u202F](?:(?:de|du|des|la|le|et|&)[ \t\u00A0\u202F]){0,2}(?:[dl][''’])?[A-ZÀ-ÖØ-ÞĀ-ſ](?:[A-ZÀ-ÖØ-ÞĀ-ſa-zß-öø-ÿĀ-ſ0-9]|[&''’.\-](?=[A-ZÀ-ÖØ-ÞĀ-ſa-zß-öø-ÿĀ-ſ0-9]))*){0,5}?)[ \t\u00A0\u202F]+(SA|SARL|SAS|SASU|EURL|SNC|SCM|SCI|GIE|EI|SCOP|SEL|Association|Fondation|Institut|Groupe|Consortium|Fédération|Syndicat|Chambre|Mutuelle|Coopérative|Ordre|Caisse|Union|Confédération|Agence|Comité|Commission|Ligue)\b'
        description: "Organization with legal form suffix (30 forms). Name = 1-6 capitalised tokens; lower-case connectors (de, du, des, la, le, et, &; at most 2) only between two of them; d'/l' glued to the next token (Story 10.3a R-ORG)"
        examples:
          - "TechCorp SA"
          - "Solutions Informatiques SARL"
          - "Conseil Entreprises SAS"
          - "DataSoft SASU"
          - "Cabinet Dubois EURL"
          - "Solutions SCOP"
          - "TechCorp Association"
          - "Marie Curie Fondation"
      - pattern: '\b(Société|Entreprise|Cabinet|Groupe|Compagnie|Association|Fondation|Institut|Consortium|Fédération|Syndicat|Chambre|Mutuelle|Coopérative|Ordre|Caisse|Union|Confédération|Agence|Comité|Commission|Ligue)[ \t\u00A0\u202F]+([A-ZÀ-ÖØ-ÞĀ-ſ](?:[A-ZÀ-ÖØ-ÞĀ-ſa-zß-öø-ÿĀ-ſ0-9]|[&''’.\-](?=[A-ZÀ-ÖØ-ÞĀ-ſa-zß-öø-ÿĀ-ſ0-9]))*(?:[ \t\u00A0\u202F](?:(?:de|du|des|la|le|et|&)[ \t\u00A0\u202F]){0,2}(?:[dl][''’])?[A-ZÀ-ÖØ-ÞĀ-ſ](?:[A-ZÀ-ÖØ-ÞĀ-ſa-zß-öø-ÿĀ-ſ0-9]|[&''’.\-](?=[A-ZÀ-ÖØ-ÞĀ-ſa-zß-öø-ÿĀ-ſ0-9]))*){0,5})'
        description: "Organization with prefix keyword (22 prefixes), same name shape as above (Story 10.3a R-ORG)"
        examples:
          - "Société TechCorp"
          - "Entreprise Dubois"
          - "Cabinet Martin"
          - "Groupe Lefebvre"
          - "Association Française"
          - "Fondation Marie Curie"
          - "Institut Pasteur"
          - "Consortium Européen"
          - "Fédération Nationale"
          - "Cabinet Mercier & Associés"

  # Low confidence patterns: Geography dictionary
  geography_dictionary:
    enabled: true
    confidence: 0.60
    entity_type: LOCATION
    use_geography_dictionary: true
    description: "Match known French cities, regions, and departments"
    # Matching is done programmatically in RegexMatcher using geography dictionary
    examples:
      - "Paris"
      - "Marseille"
      - "Île-de-France"
      - "Bouches-du-Rhône"
      - "Toulouse"

  # Medium confidence patterns: Full names using dictionary
  full_names:
    enabled: true
    confidence: 0.65
    entity_type: PERSON
    use_name_dictionary: true
    description: "Matches [Firstname] [Lastname] combinations using French name dictionary"
    # Pattern matching is done programmatically in RegexMatcher using name dictionary
    # Format: [Known First Name] [Known Last Name]
    examples:
      - "Marie Dubois"
      - "Jean Martin"
      - "François Bernard"
      - "Sophie Laurent"
