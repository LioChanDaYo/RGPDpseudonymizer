# LOCATION noise stoplist (Story 10.3b, AC1, AC2). A LOCATION detection whose
# whole normalized text (prepositions, then titles stripped; whitespace
# collapsed) is an entry, compared case-folded and accent-sensitive, and is
# not a geography-dictionary place, is dropped. Every entry needs a `why`
# that holds for any French business text. Never add an entry because it
# appeared as an FP in the corpus alone; never add held-out strings; never
# add a place, "US"/"USA"/"UK"/"UE"/"EU" (GUIDELINES Q14/A5), a compass
# region (A3) or a region acronym (A8).
# Frozen list: Story 10.3b Task 2 (Lionel's STOP R decisions, 2026-10-07).
# Changes go back through the story.

